 67}, {"orig_id": 68, "category": "地理篇", "ans": "D", "q": "臺灣第一座經由地方民間保育團體發起推動而成立的園區，範圍包含壽山、半屏山、龜山、左營舊城及旗後山等自然地形與人文史。符合此敘述的園區是？", "options": ["玉山國家公園", "茂林國家風景區", "藤枝國家森林遊樂區", "壽山國家自然公園。"], "id": 68}, {"orig_id": 69, "category": "地理篇", "ans": "B", "q": "由碼頭舊倉庫蛻變為高雄文化創意基地，融合展覽、音樂、設計與鐵道文化，透過水岸輕軌串聯，打造充滿活力的藝術聚落，是民眾休閒旅遊的好景點是指哪一個景點？", "options": ["城市光廊", "駁二藝術特區", "紅毛港文化園區", "市民藝術大道。"], "id": 69}, {"orig_id": 70, "category": "地理篇", "ans": "C", "q": "位於高雄港二港口入口處，在園區內可觀看大船入港、欣賞夕陽美景，還    可以穿梭在聚落建築中，探尋聚落歷史文化指的是哪裡？", "options": ["哈瑪星鐵道文化園區", "駁二藝術特區", "紅毛港文化園區", "十鼓橋糖文創園區。"], "id": 70}, {"orig_id": 71, "category": "地理篇", "ans": "C", "q": "橫跨於高雄港第三船渠，連結駁二藝術特區與高雄港蓬萊商港區，是臺灣    第一座可旋轉的行人跨港大橋指的是哪一座橋？", "options": ["駁二橋", "愛河橋", "大港橋", "小港橋。"], "id": 71}, {"orig_id": 72, "category": "地理篇", "ans": "D", "q": "高雄市境內景觀多變，擁有沖積平原、高山山脈、惡地、河流等地景，下    列哪一個不是本市地景？", "options": ["十八羅漢山與荖濃溪地景", "崗山之眼與平原景觀", "壽山的珊瑚礁海岸景觀", "龍崎牛埔惡地地質公園。"], "id": 72}, {"orig_id": 73, "category": "地理篇", "ans": "A", "q": "關於高雄市的區域特色，下列敘述何者正確？", "options": ["擁有得天獨厚的山、海、河、港景觀", "擁有完善的交通網絡，以公車為導向的景點規劃很方便", "郊區自然風光景點豐富，市區觀光夜市美食為主，缺乏歷史古蹟", "融合了閩南、客家和原住民文化，無眷村文化。"], "id": 73}, {"orig_id": 74, "category": "地理篇", "ans": "B", "q": "高雄港所在的高雄潟湖是臺灣最接近大都會的濱海潟湖，其北端的第一港口是旗津，第二港口是哪一個地點？", "options": ["大林埔", "紅毛港", "鼓山", "前鎮 。"], "id": 74}, {"orig_id": 75, "category": "地理篇", "ans": "D", "q": "下列有關高雄市氣候特徵的敘述，何者正確？", "options": ["高雄市受季風和地形影響，雨量大多集中在東北季風盛行的時期", "高雄市緯度較低，且受沿海暖流的影響，氣溫較東北部略低", "高雄地區的風向，一至四月以南、西南和東南風為主", "以季節分布而言，高雄市的降雨明顯集中於五月至九月的熱季。"], "id": 75}, {"orig_id": 76, "category": "地理篇", "ans": "A", "q": "高雄市境內主要河川及次要河川不包含下列何者？", "options": ["濁水溪", "阿公店溪", "高屏溪", "二仁溪。"], "id": 76}, {"orig_id": 77, "category": "地理篇", "ans": "D", "q": "下列有關高雄港的敘述，何者有誤？", "options": ["是結合了軍、工、商、漁港功能的總和式港口", "是臺灣南部物資集散中心", "是臺灣最大的國際通商港", "港灣遼闊，西隔臺灣海峽與香港相望"], "id": 77}, {"orig_id": 78, "category": "地理篇", "ans": "D", "q": "高雄市政府在15-21 號碼頭及外海區啟動一系列的城市建設計劃，包含下列哪些建設？(甲)高雄展覽館(高雄世界貿易展覽會議中心) (乙)高雄港旅運中心(高雄港港埠旅運中心) (丙)高雄流行音樂中心(海洋文化及流行音樂中心) (丁)市立圖書館總館", "options": ["甲乙丙", "甲乙丁", "乙丙丁", "甲乙丙丁。"], "id": 78}, {"orig_id": 79, "category": "地理篇", "ans": "C", "q": "在高雄境內可觀賞世界級生態景觀—紫斑蝶的是哪個地方？", "options": ["玉山國家公園", "壽山國家自然公園", "茂林國家風景區", "觀音山赤腳自然公園。"], "id": 79}, {"orig_id": 80, "category": "地理篇", "ans": "D", "q": "澄清湖水庫水源取自哪一條河川的地面水及伏流水？", "options": ["愛河", "後勁溪", "前鎮河", "高屏溪。"], "id": 80}, {"orig_id": 81, "category": "地理篇", "ans": "B", "q": "本區居民多為來臺開墾先民之後裔形成之聚落，因溪畔遍植楠木而命名；現代有高速公路、濱海公路、縱貫公路經過，是交通往來的重要節點。此行政區為？", "options": ["左營區", "楠梓區", "鹽埕區", "三民區。"], "id": 81}, {"orig_id": 82, "category": "地理篇", "ans": "D", "q": "與高雄港、旗津區相望，且擁有日治時期遺留下來的山形屋、日式家屋等古蹟的是哪一個行政區？", "options": ["鹽埕區", "前鎮區", "小港區", "鼓山區。"], "id": 82}, {"orig_id": 83, "category": "地理篇", "ans": "A", "q": "下列哪一個敘述是旗津區的特色？", "options": ["旗後山是島上唯一高地", "除了發展觀光遊憩碼頭外，持續推動柴山自然公園的保育工作", "海軍司令部位在此區內", "具有大量眷村特色。"], "id": 83}, {"orig_id": 84, "category": "地理篇", "ans": "C", "q": "下列有關三民區的敘述，何者有誤？", "options": ["是高雄市人口第二多的行政區。", "本區新舊社區並存，外縣市移入人口比例高", "八十五層樓高的世貿中心，是本區最明顯的地標", "是以「高雄火車站」為中心的陸運轉運站。"], "id": 84}, {"orig_id": 85, "category": "地理篇", "ans": "B", "q": "此區地形略呈半環形，為加工出口區的發源地、重工業林立，也是眾多航運貨櫃存放場。這是哪個行政區？", "options": ["小港區", "前鎮區", "岡山區", "湖內區。"], "id": 85}, {"orig_id": 86, "category": "地理篇", "ans": "C", "q": "原名港仔墘，因位於高雄潟湖南岸之鳳山港畔而命名的是哪一個行政區？", "options": ["鳳山區", "前金區", "小港區", "新興區。"], "id": 86}, {"orig_id": 87, "category": "地理篇", "ans": "D", "q": "下列有關鹽埕區的相關敘述，何者有誤？", "options": ["具有愛河水岸景觀，有浪漫的親水臺階及優美的行人步道", "區內駁二藝術特區為碼頭閒置倉庫空間再利用的多元藝文展演空間", "高雄市立歷史博物館是一棟具有歷史意義、城市地標意涵的景點", "區內的「玫瑰聖母堂」建築富有特色，為臺灣天主教的發源地。"], "id": 87}, {"orig_id": 88, "category": "地理篇", "ans": "A", "q": "「地形形似棋盤、南北略長、東西稍短，雖在高雄市各區中是屬於規模較小的行政區，但機關林立，文教氣息濃厚，擁有地方法院等機構。」此敘述指的是哪一個行政區？", "options": ["前金區", "苓雅區", "新興區", "鳳山區。"], "id": 88}, {"orig_id": 89, "category": "地理篇", "ans": "B", "q": "區域內有典型的小吃夜市「六合夜市」，人口密度為高雄市之冠的是哪一個行政區？", "options": ["三民區", "新興區", "前金區", "鹽埕區。"], "id": 89}, {"orig_id": 90, "category": "地理篇", "ans": "B", "q": "下列有關仁武區的敘述，何者正確？", "options": ["盛產棗子、芭樂和西施柚", "近年因仁武工業區的設置，產業型態由農業逐漸轉為工商業", "戰後此地仍為臺灣重要空軍基地，空軍官校也設在此地", "具有翠屏夕照，為古鳳山八景之一。"], "id": 90}, {"orig_id": 91, "category": "地理篇", "ans": "C", "q": "下列有關大社區的敘述，何者有誤？", "options": ["擁有享譽國際的皮影戲", "觀音山連綿十數座小山峰，山勢和緩、土質細膩，因此登山訪客多赤腳行走而有「赤腳公園」之別稱", "以羊肉、蜂蜜與豆瓣醬著名", "盛產棗子、珍珠芭樂。"], "id": 91}, {"orig_id": 92, "category": "地理篇", "ans": "D", "q": "舊名半路竹，是青花菜、蛋雞的故鄉，也是臺灣螺絲外銷量主要的生產地區是哪裡？", "options": ["岡山區", "燕巢區", "永安區", "路竹區。"], "id": 92}, {"orig_id": 93, "category": "地理篇", "ans": "A", "q": "哪一個行政區是南臺灣重要蔬菜生產中心，其南側的蚵仔寮漁港可以購買新鮮的漁獲，還可以觀看日出及夕陽？", "options": ["梓官區", "橋頭區", "湖內區", "永安區。"], "id": 93}, {"orig_id": 94, "category": "地理篇", "ans": "D", "q": "相傳彌陀區在兩百多年前，常有漢人在北側阿公店溪的入海處拉竹筏過溪，卻因河水湍急而溺斃，因此有人搭草寮恭奉神明祈求平安，並因從此無事而得名。據傳當時供奉的是哪一尊神明？", "options": ["釋迦摩尼", "觀音菩薩", "彌勒佛", "阿彌陀佛。"], "id": 94}, {"orig_id": 95, "category": "地理篇", "ans": "B", "q": "「石斑魚之鄉」指的是哪一個行政區？", "options": ["彌陀區", "永安區", "湖內區", "前鎮區。"], "id": 95}, {"orig_id": 96, "category": "地理篇", "ans": "B", "q": "「位於曹公圳新圳幹線，不僅適合農業的發展，也有完整的濕地生態體系，區內的澄清湖更是自來水公司供應大高雄用水的蓄水池。」以上敘述所指的是哪一個行政區？", "options": ["大樹區", "鳥松區", "大寮區", "林園區。"], "id": 96}, {"orig_id": 97, "category": "地理篇", "ans": "A", "q": "內門區的廟會活動已成為臺灣十二大國際民俗觀光節慶之一，其中尤以什麼活動為主要重頭戲？", "options": ["宋江陣", "高蹺陣", "車鼓陣", "蜈蚣陣。"], "id": 97}, {"orig_id": 98, "category": "地理篇", "ans": "D", "q": "炎熱的氣候、肥沃的土壤，絲瓜、胡瓜、木瓜，所有蔬菜類的瓜都種，號稱「瓜果之鄉」的是哪一個行政區？", "options": ["甲仙區", "內門區", "六龜區", "杉林區。"], "id": 98}, {"orig_id": 99, "category": "地理篇", "ans": "C", "q": "於2008 年時更改名稱，以「Namasia」（楠梓仙溪）為新鄉名，並於縣市合併後改制為區的是哪一個行政區？", "options": ["茄萣區", "茂林區", "那瑪夏區", "桃源區。"], "id": 99}, {"orig_id": 100, "category": "地理篇", "ans": "C", "q": "有「臺灣正港的烏魚大港」之稱的的興達港，位於哪一個行政區？", "options": ["湖內區", "永安區", "茄萣區", "彌陀區。"], "id": 100}, {"orig_id": 1, "category": "歷史篇", "ans": "B", "q": "日本學者伊能嘉矩認為「打狗」之名，源於原先居住在此的平埔族馬卡道(Makatao 或Mkatatau)族語(Takau)，其意係指？", "options": ["柴山", "竹林", "凹仔底", "內惟埤。"], "id": 101}, {"orig_id": 2, "category": "歷史篇", "ans": "C", "q": "日本治臺初期，官方對高雄的稱號沿用打狗地名，直到1920 年，日本政府將原本具鄉土氣息的地名「打狗」以「高雄」取代，理由係為？", "options": ["將壽山看做既高又雄偉的富士山而以山形命名高雄", "為紀念日治初期日人教師田中高雄對於皇民教育文化推廣有功以其名紀念之", "漢字「高雄」詞語的日語發音為「Takao」、「たかお」和打狗「Takau」兩字的發音十分相近", "日治時期台灣總督府認為未來打狗可建設為高水準又雄偉的城市規模而取名高雄。"], "id": 102}, {"orig_id": 3, "category": "歷史篇", "ans": "D", "q": "原高雄縣曾有「三山一體、均富共榮」的施政口號，三山是指現在高雄市的哪三個區域？", "options": ["柴山、半屏山、龜山", "鳳凰山、漯底山、駱駝山", "十八羅漢山、旗尾山、鼓山", "鳳山、岡山、旗山。"], "id": 103}, {"orig_id": 4, "category": "歷史篇", "ans": "A", "q": "高雄市哪個行政區是早期高雄地區重要交通渠道之稱，古有「三山歸一坑」之說，這是指哪個行政區？", "options": ["楠梓區", "田寮區", "大社區", "左營區。"], "id": 104}, {"orig_id": 5, "category": "歷史篇", "ans": "D", "q": "高雄市三民區舊稱三塊厝，於日治時期設有高雄中學校，製罐、煉瓦、酒精工廠，1941 年(昭和16 年)設立高雄車站後而更加快速發展，1945 年國民政府為何將三塊厝改名為三民區？", "options": ["取紀念王、蔡、鄭三姓家族來此開墾", "取有知名年貨大街的三鳳中街", "取有全臺太子廟總壇名號的三鳳宮", "取建設三民主義模範區之義。"], "id": 105}, {"orig_id": 6, "category": "歷史篇", "ans": "C", "q": "高雄市哪個行政區原名魚逮港埔，而「魚逮港埔」就是指河邊未開發的荒地，「魚逮港」為愛河支流三塊厝溪的中段，因盛產魚逮(鯉)魚而得名？", "options": ["前金區", "鹽埕區", "新興區", "苓雅區。"], "id": 106}, {"orig_id": 7, "category": "歷史篇", "ans": "B", "q": "高雄市哪個行政區地處下淡水溪(今高屏溪)右岸，因溪埔土質肥沃，居民紛紛前往屯墾，並以甘蔗葉搭建寮房，有一寮房區稱為「溪埔寮」，本區與左營、鳳山、岡山並列高雄市眷村的集中地，區內亦設有鳳屏工業區？", "options": ["大樹區", "大寮區", "大社區", "林園區。"], "id": 107}, {"orig_id": 8, "category": "歷史篇", "ans": "A", "q": "以羊肉、蜂蜜與豆瓣醬著名，重要節慶的籮仔筐會紀念保家衛鄉的義行，也吸引許多遊客共襄盛舉，係指以下哪個行政區的產業暨文化特質？", "options": ["岡山區", "田寮區", "橋頭區", "阿蓮區。"], "id": 108}, {"orig_id": 9, "category": "歷史篇", "ans": "B", "q": "清康熙年間叫做「小店仔街」，本區境內有臺灣第一座現代化機械式製糖工廠，創立至今已超過百年，已經被指定為市定古蹟，這是高雄市的哪個行政區？", "options": ["左營區", "橋頭區", "鳳山區", "旗山區。"], "id": 109}, {"orig_id": 10, "category": "歷史篇", "ans": "C", "q": "高雄市燕巢區是明鄭時期援剿中鎮與右鎮屯田舊址，故原名「援剿」，燕巢即為「援剿」，以下哪項是燕巢區特產水果？", "options": ["鳳梨與香蕉", "蘋果與椪柑", "芭樂與棗子", "愛文芒果及金煌芒果。"], "id": 110}, {"orig_id": 11, "category": "歷史篇", "ans": "D", "q": "有位北部來的旅客自行開車從國道三號驅車南下，想要來高雄市觀看「月世界」的惡地地形，又能夠在附近品嘗土窯雞的美味，高雄市哪個行政區最符合這位旅客遊玩的目的地？", "options": ["大樹區", "旗山區", "燕巢區", "田寮區。"], "id": 111}, {"orig_id": 12, "category": "歷史篇", "ans": "C", "q": "高雄市哪個行政區境內大崗山為有名的佛教聖地，盛產龍眼，每一年的「大崗山龍眼節」均在此舉行？", "options": ["岡山區", "燕巢區", "阿蓮區", "彌陀區。"], "id": 112}, {"orig_id": 13, "category": "歷史篇", "ans": "C", "q": "高雄市路竹區地當於湖內區與岡山區之間交通必經地，地當半路上，又有茂盛的竹林，所以得稱。路竹區內盛產四寶，以下哪一項非四寶之一？", "options": ["番茄", "花椰菜", "石斑魚", "雞蛋。"], "id": 113}, {"orig_id": 14, "category": "歷史篇", "ans": "A", "q": "高雄市哪個行政區有興達漁港及情人碼頭位於區內，海鮮魚貨為本區之特產，此外，每十二年舉行一次的迎王祭，乃本區之特有民俗祭典活動？", "options": ["茄萣區", "永安區", "彌陀區", "林園區。"], "id": 114}, {"orig_id": 15, "category": "歷史篇", "ans": "B", "q": "高雄市在發展一鄉一特色的政策當中，永安區以養殖哪種魚種揚名全臺？", "options": ["虱目魚", "石斑魚", "土魠魚", "秋刀魚。"], "id": 115}, {"orig_id": 16, "category": "歷史篇", "ans": "D", "q": "高雄市彌陀區舊稱「彌陀港」，早期的文獻中，地名確有不同的寫法，記作「微羅港」，或「眉螺港」，以下哪個是彌陀區的主要產業？", "options": ["種植蔬菜", "種植鳳梨", "養殖烏魚", "養殖虱目魚。"], "id": 116}, {"orig_id": 17, "category": "歷史篇", "ans": "C", "q": "高雄市哪個行政區境內有蚵仔寮漁港，現撈漁獲量為高雄市之冠，而且同時是高雄地區重要的蔬菜產地？", "options": ["楠梓區", "彌陀區", "梓官區", "林園區。"], "id": 117}, {"orig_id": 18, "category": "歷史篇", "ans": "A", "q": "高雄市哪個行政區原稱蕃薯寮，因為初期移民築寮於此，並從事種植蕃薯，所以稱為「蕃薯寮」？", "options": ["旗山區", "甲仙區", "大寮區", "內門區。"], "id": 118}, {"orig_id": 19, "category": "歷史篇", "ans": "D", "q": "中北部旅客想到高雄市轄區的客家文化特色小鎮，體驗製作油紙傘、藍布衫的客家文化特有之工藝，您會推薦到哪個行政區旅遊？", "options": ["杉林區", "內門區", "茂林區", "美濃區。"], "id": 119}, {"orig_id": 20, "category": "歷史篇", "ans": "C", "q": "高雄市六龜區因三面環山，而荖濃溪畔有三塊大岩石與六山岩相倂對立，狀似龜形，因而得名。以下哪項是六龜區的特產？", "options": ["金黃香蕉和蘋果鳳梨", "牛奶芭樂和貴妃荔枝", "黑鑽石蓮霧和金煌芒果", "玉女番茄和白玉蘿蔔。"], "id": 120}, {"orig_id": 21, "category": "歷史篇", "ans": "B", "q": "安排戶外教學想帶領學生了解芋頭的栽種歷程，並能品嚐芋頭的美味食品如芋仔冰及芋仔餅等，可規劃到高雄市哪個行政區進行戶外教學？", "options": ["旗山區", "甲仙區", "桃源區", "杉林區。"], "id": 121}, {"orig_id": 22, "category": "歷史篇", "ans": "C", "q": "總鋪師總數是全國之最，可說是全臺灣總舖師分布最密集的鄉鎮，係指高雄市哪個行政區的特色？", "options": ["大寮區", "旗山區", "內門區", "永安區。"], "id": 122}, {"orig_id": 23, "category": "歷史篇", "ans": "D", "q": "日治時期，高雄地區有雅你部落，布農族人稱之為Gani，日人遂稱Gani 社。民國35 年當時以雅你社之部落人丁較旺，遂將鄉名稱為「雅你鄉」，這是目前高雄市的哪個行政區？", "options": ["茂林區", "甲仙區", "那瑪夏區", "桃源區。"], "id": 123}, {"orig_id": 24, "category": "歷史篇", "ans": "A", "q": "高雄市哪個行政區具原始景觀為山杉蓊蔚成林，區內炎熱的氣候、肥沃的土壤，絲瓜、胡瓜、木瓜，所有蔬菜類的瓜都種，號稱「瓜果之鄉」，還有別具特色的葫蘆雕刻藝術館？", "options": ["杉林區", "那瑪夏區", "甲仙區", "茂林區"], "id": 124}, {"orig_id": 25, "category": "歷史篇", "ans": "C", "q": "茂林區原名「多納鄉」，為日語「屯子」的譯音，區內大部分居住者為魯凱族原住民，區內最大的人文特色為魯凱族文化，其改稱為茂林區的理由是？", "options": ["區內擁有茂盛的樹林", "紀念日本人統治本區之初，本區原住民不堪日人暴力壓迫聯合各社抵抗因而得名", "追念清代統領「陶茂林」治理的工作績效", "感念部落領袖「阿布斯茂林」對魯凱族文化推廣的貢獻。"], "id": 125}, {"orig_id": 26, "category": "歷史篇", "ans": "B", "q": "高雄市那瑪夏區，舊名瑪雅，原為南鄒族卡那卡那富群居住地， 在日治時代稱為「瑪雅峻」，民國97 年1 月1 日正名「那瑪夏鄉」，「那瑪夏」其原意是指？", "options": ["玉山山脈", "楠梓仙溪", "南鄒族拉阿魯哇部落", "卡那卡那富群居住地。"], "id": 126}, {"orig_id": 27, "category": "歷史篇", "ans": "C", "q": "高雄平原地區遺址中，係屬蔦松文化遺址名稱的地區是以下哪一項？", "options": ["大寮區拷潭", "岡山區小崗山", "楠梓區後勁", "左營區桃子園。"], "id": 127}, {"orig_id": 28, "category": "歷史篇", "ans": "B", "q": "高雄丘陵台地地區遺址中，係屬牛稠子文化遺址名稱的地區是以下哪一項？", "options": ["旗山區虎形坑", "杉林區二坪頂", "美濃區人字山下", "田寮區後山岩。"], "id": 128}, {"orig_id": 29, "category": "歷史篇", "ans": "A", "q": "關於平埔族早期的傳統社會制度與習俗，下列敘述何者正確？", "options": ["屬於母系社會，由女性繼承家產。", "實施「贅婚制」，男子出嫁到女方家，稱為「家後」。", "部落的公眾事務（如出征、狩獵）通常由女性長老全權決定。", "男性婚後必須立刻離開部落，定居於漢人社區"], "id": 129}, {"orig_id": 30, "category": "歷史篇", "ans": "C", "q": "關於鄒族傳統祭典「瑪雅斯比」(Mayasvi) 的敘述，下列何者正確？", "options": ["是為了祈求海上作業平安的祭典。", "祭典的核心場所是在部落的「Kuba」(男子集會所) 舉行。", "每年固定在二月或八月舉行，是為了慶祝小米豐收", "祭典中著名的「報戰功」儀式是為了招攬觀光客。"], "id": 130}, {"orig_id": 31, "category": "歷史篇", "ans": "A", "q": "拉阿魯哇族，每年會舉行最盛大的傳統祭典「子安貝祭」。關於此祭典的敘述，下列何者正確？", "options": ["祭典的核心是祭祀象徵守護神的十二個聖貝", "祭典中著名的儀式是射耳，用以傳承狩獵技巧。", "所有族人共同參與，是場面最浩大的宗教祭儀，十年舉辦一次", "祭典結尾會將聖貝丟入海中，象徵送神回歸大海。"], "id": 131}, {"orig_id": 32, "category": "歷史篇", "ans": "C", "q": "生活在高雄市中央山脈地區的哪一原住民族，其歌唱時當音域高到某一個層次即出現了八個不同的音階，被世人稱之為「八部合音」，這也是目前世界上獨一無二的和音方式？", "options": ["泰雅族", "排灣族", "布農族", "魯凱族。"], "id": 132}, {"orig_id": 33, "category": "歷史篇", "ans": "D", "q": "布農族的哪位領導人物，善觀天象、氣候並維持社會秩序、協調糾紛？", "options": ["負責爭戰、獵首的勇士", "政治領袖", "射耳祭的主持者", "主持農事祭儀的祭師。"], "id": 133}, {"orig_id": 34, "category": "歷史篇", "ans": "B", "q": "高雄平原北部的哪一社的平埔族，原居於高雄茄萣區白沙崙，到路竹區的大社、下社；南到典寶溪出海口一帶，與「阿加社」毗鄰，北至二層行溪與新港社為鄰？", "options": ["港西里社", "大傑顛社", "尖山社", "打狗社。"], "id": 134}, {"orig_id": 35, "category": "歷史篇", "ans": "A", "q": "高雄市左營區舊城國小校園舊孔廟崇聖祠的碑林中，有一塊乾隆元年立的「嚴禁侵佔番界審斷碑」碑文中曾提及漢人與哪一社的平埔族所發生的土地糾紛，並告誡不可侵佔番地？", "options": ["尖山社", "塔里揚社", "阿加社", "武洛社。"], "id": 135}, {"orig_id": 36, "category": "歷史篇", "ans": "B", "q": "高雄市鳳山區因境內有一弧列狀隆起的珊瑚礁台地，一層一層山巒疊翠，北端為太平頂，南端為鳳鼻，遠眺宛如飛鳳展翅，所以稱為鳳山，其舊地名稱為？", "options": ["小店仔街", "下坡頭街", "港仔墘", "阿公店。"], "id": 136}, {"orig_id": 37, "category": "歷史篇", "ans": "C", "q": "高雄市茄萣區的地名由來，以下哪項是正確的？", "options": ["烏魚子的別名", "興達漁港的舊稱", "紅樹林的植物", "情人碼頭的佳人定終身。"], "id": 137}, {"orig_id": 38, "category": "歷史篇", "ans": "D", "q": "距今約3,500～2,000 年的新石器時代晚期的大湖文化中，分布在高雄後勁溪以南到恆春半島南端之間的海岸地帶，由於遺址是貝塚又處在珊瑚礁石灰岩區，出土的骨器保存良好，且數量很多，包括骨匕、骨鑿、魚叉、魚鉤等，這是在高雄市哪一處遺址？", "options": ["美濃中圳尾遺址", "田寮南安遺址", "桃源勤和村遺址", "桃子園遺址。"], "id": 138}, {"orig_id": 39, "category": "歷史篇", "ans": "A", "q": "高雄境內發現距今2000-400 年前的金屬器時代的蔦松文化遺址，以下哪一處不屬於蔦松文化遺址的類型？", "options": ["牛稠子", "清水岩", "萬山岩", "扇平。"], "id": 139}, {"orig_id": 40, "category": "歷史篇", "ans": "C", "q": "高雄市以下哪項區域係屬大坌坑文化遺址，曾發現紅褐色夾砂繩紋陶、淡褐色夾砂陶、磨製石器等出土遺物？", "options": ["鼓山區龍泉寺", "三民區覆鼎金", "小港區孔宅", "楠梓區後勁。"], "id": 140}, {"orig_id": 41, "category": "歷史篇", "ans": "B", "q": "臺灣八大平埔族群中，分佈在高雄地區的是以下哪一族群？", "options": ["洪雅族", "西拉雅族", "貓霧族", "道卡斯族。"], "id": 141}, {"orig_id": 42, "category": "歷史篇", "ans": "B", "q": "高雄市甲仙、六龜、杉林等區的大武壟社群雖深受漢化的影響，尚且保留有完整的平埔族「阿立祖」的信仰，另外卻也接受漢人的信仰，不包含以下哪一神祇信仰？", "options": ["玄天上帝", "地藏王菩薩", "觀音菩薩", "媽祖。"], "id": 142}, {"orig_id": 43, "category": "歷史篇", "ans": "D", "q": "平埔族以簡單的方法紀錄時間，最普遍的是以哪種花開當作一年為記時標誌？", "options": ["茉莉花", "龍眼花", "百合花", "刺桐花。"], "id": 143}, {"orig_id": 44, "category": "歷史篇", "ans": "D", "q": "西拉雅族社會中，每一個部落會有一位或多位的女巫師，負責處理公眾的祭典事宜，可以透過巫術的力量為社人解迷津，並獲得解決，女巫師稱為？", "options": ["仙姑", "神婆", "玄女", "尪姨。"], "id": 144}, {"orig_id": 45, "category": "歷史篇", "ans": "C", "q": "魯凱族的社會階級制度嚴謹，具有特殊功績的平民或有特殊才能的村民，如雕刻匠、打鐵匠，這是哪一個階級？", "options": ["大頭目", "貴族", "士", "平民。"], "id": 145}, {"orig_id": 46, "category": "歷史篇", "ans": "A", "q": "在魯凱族的慶典中哪一種活動以傳達男女情意的活動，現已演變為男女互相認識，傳達情意的活動？", "options": ["盪鞦韆比賽", "捕魚比賽", "打獵比賽", "種黑米比賽。"], "id": 146}, {"orig_id": 47, "category": "歷史篇", "ans": "D", "q": "荷蘭統治時期，每年二月以後的非漁汛期間，大陸沿海漁民和打狗地區的平埔族也從事小資本、小規模的會合交易行為。而這些會合交易可能大都聚集於打狗灣內側「貿易商島」，大概是現今的哪個區域？", "options": ["哈瑪星鐵道文化園區", "旗津輪渡口", "駁二文創園區", "中島商港區。"], "id": 147}, {"orig_id": 48, "category": "歷史篇", "ans": "C", "q": "明鄭時期，為解決龐大軍糧與眷糧的問題，厚植抗清實力，以及防止荷人攻臺，鄭氏在臺灣實施「寓兵於農」政策，由軍隊開墾田園，自給自足者稱為？", "options": ["王田", "官田", "營盤田", "軍井田。"], "id": 148}, {"orig_id": 49, "category": "歷史篇", "ans": "D", "q": "明鄭時期高雄地區軍屯地點中，「營前庄」及「營後庄」是指現在的哪個行政區？", "options": ["左營區", "前鎮區", "鳳山區", "路竹區。"], "id": 149}, {"orig_id": 50, "category": "歷史篇", "ans": "B", "q": "高雄地區明鄭時期官吏私墾中的參軍庄，係為明鄭諮議參軍陳永華招佃開墾，係在今日的哪個區域？", "options": ["鳳山區埤頂", "湖內區大湖", "路竹區竹滬里", "仁武區拷潭。"], "id": 150}, {"orig_id": 51, "category": "歷史篇", "ans": "A", "q": "高雄地區明鄭時期民墾地中，為泉州府同安縣林姓族人及漳州府龍溪縣方姓族人招佃開墾的赤山仔庄，是指現在的哪一區域？", "options": ["仁武區灣內里", "鳳山區文德里", "左營區廟北里", "燕巢區安招里。"], "id": 151}, {"orig_id": 52, "category": "歷史篇", "ans": "C", "q": "明鄭時期高雄地區的軍屯陂圳中的「竹橋陂」，這是指目前的哪個行政區？", "options": ["永安區", "仁武區", "鳥松區", "湖內區。"], "id": 152}, {"orig_id": 53, "category": "歷史篇", "ans": "D", "q": "明鄭時期高雄地區的軍屯陂圳中，其地點為今鳳山區陸軍官校黃埔湖，這是指哪一軍屯陂圳？", "options": ["三爺陂", "蘇左協陂", "王田陂", "賞舍陂。"], "id": 153}, {"orig_id": 54, "category": "歷史篇", "ans": "B", "q": "1673 年，哪位福建漁民來打狗海域捕魚時，因遇颱風而避至打狗港以躲風雨，發現旗後港區一帶的沙汕，出海捕魚極為便利，後來返鄉邀集同鄉漁民一同定居，漸漸發展成聚落，並建蓋廟宇，這些漁民便成為旗後的開基主？", "options": ["陳近南", "徐阿華", "洪阿舍", "甘國寶。"], "id": 154}, {"orig_id": 55, "category": "歷史篇", "ans": "C", "q": "高雄地區屬亞熱帶氣候，一年之間旱濕各半，降雨量不平均，雨季大都集中於七、八月份，稱為什麼時節？", "options": ["小滿", "雨水", "騎秋", "穀雨。"], "id": 155}, {"orig_id": 56, "category": "歷史篇", "ans": "A", "q": "荷蘭統治時期高雄平原拓墾，平埔族的耕作技術落後，只會使用鍬，沒有其他農具，男人只顧打獵，女性是勞動力的主體，所以稻米產量不足以為荷蘭東印度公司帶來經濟利益，因此，荷蘭人引進哪種技術協助農作，耕地面積逐漸擴大？", "options": ["耕牛", "耕驢", "耕馬", "鋤頭。"], "id": 156}, {"orig_id": 57, "category": "歷史篇", "ans": "D", "q": "荷蘭時期荷蘭人以統治者的心態，把臺灣的每一寸土地都劃歸東印度公司所有不論是漢人或平埔族，都是公司的佃農。不准「漢佃」擁有土地，甚至要求他們春來秋去，不准定居，引起漢人極大的不滿，才引爆1652 年的哪個抗荷事件？", "options": ["簡大獅", "林道乾", "劉永福", "郭懷一。"], "id": 157}, {"orig_id": 58, "category": "歷史篇", "ans": "B", "q": "明鄭時期高雄地區的軍屯陂圳中，其地點在今永安區新港、保寧、鹽田里一帶的是以下哪一處？", "options": ["三爺陂", "烏樹林陂", "中衝崎陂", "蘇左協陂。"], "id": 158}, {"orig_id": 59, "category": "歷史篇", "ans": "C", "q": "明鄭時期高雄地區的軍屯陂圳中在鳳山庄的輔政陂，係由當時明鄭時期的哪位輔政公所築？", "options": ["陳永華", "施琅", "鄭聰", "曹謹。"], "id": 159}, {"orig_id": 60, "category": "歷史篇", "ans": "B", "q": "高雄縣市於哪一年合併改制，成為南臺灣最具潛力與競爭力的大高雄？", "options": ["2009 年(民國98 年)", "2010 年(民國99 年)", "2011 年(民國100 年)", "2012年(民國101 年)。"], "id": 160}, {"orig_id": 61, "category": "歷史篇", "ans": "D", "q": "以「高雄」的名稱命名，何時取代「打狗」命名，正式登上歷史舞台？", "options": ["荷西時期", "明鄭時期", "清治時期", "日治時期。"], "id": 161}, {"orig_id": 62, "category": "歷史篇", "ans": "B", "q": "高雄發現的史前文化遺址中，哪一遺址距今最為久遠？", "options": ["牛稠子文化", "大坌坑文化", "大湖文化", "鳳鼻頭文化。"], "id": 162}, {"orig_id": 63, "category": "歷史篇", "ans": "D", "q": "高雄重要的水源，被稱為下淡水溪是今日的哪一河流？", "options": ["後勁溪", "愛河", "前鎮河", "高屏溪。"], "id": 163}, {"orig_id": 64, "category": "歷史篇", "ans": "B", "q": "高雄有座遺址，其特色是：「位於山上的石雕群，紋飾圖像有蛇紋、人形紋、雲紋、圓渦紋、人頭像、人像、生命曲線、杯狀坑、足掌紋、凹點等」，該遺址已經被指定為國定遺址。請問該遺址是？", "options": ["鳳鼻頭遺址", "萬山岩雕遺址", "扇平遺址", "清水岩遺址。"], "id": 164}, {"orig_id": 65, "category": "歷史篇", "ans": "D", "q": "在高雄地區所發現重要的史前遺址中，分布鳳山丘陵及內門丘陵南緣一帶。學者從發現的遺物推測當時的人們已懂得農耕，但主要生產活動農漁獵並重。哪一個符合以上的敘述？", "options": ["牛稠子文化遺址", "大湖文化類型", "大坌坑文化遺址", "鳳鼻頭文化遺址。"], "id": 165}, {"orig_id": 66, "category": "歷史篇", "ans": "A", "q": "高雄境內發現的「蔦松文化遺址」，分別為蔦松類型、清水岩類型、美濃 類型、扇平類型、比鼻烏類型、萬山岩雕遺址等。蔦松文化距今約 2,000 ～400年，請問是屬於下列哪一時代晚期大高雄史前遺址文化？", "options": ["金屬器時代", "新石器時代早期", "新石器時代中期", "舊石器時代"], "id": 166}, {"orig_id": 67, "category": "歷史篇", "ans": "B", "q": "辨別臺灣出土文化遺址屬於舊石器、新石器文化，主要是根據哪一項？", "options": ["是否懂得使用火", "是否出現農耕", "是否存在宗教信仰", "是否出現金屬器具。"], "id": 167}, {"orig_id": 68, "category": "歷史篇", "ans": "B", "q": "平埔族有「生女謂之有賺，則喜，生男出贅，謂之無賺」之語，可見平埔族是？", "options": ["父系社會", "母系社會", "重男輕女", "男女平權。"], "id": 168}, {"orig_id": 69, "category": "歷史篇", "ans": "C", "q": "臺灣的原住民在語言和體質方面經過考證和研究證實和哪一民族關係密切？", "options": ["印歐語系", "閃米語系", "南島語系", "漢藏語系。"], "id": 169}, {"orig_id": 70, "category": "歷史篇", "ans": "B", "q": "將瓶罐等容器盛水，插上草葉，祭祀對象是祖先阿立祖，祭祀於公廨或太祖廟，有「拜壺的民族」之稱，這是哪一原住民的信仰？", "options": ["凱達格蘭族", "西拉雅族", "排灣族", "阿美族。"], "id": 170}, {"orig_id": 71, "category": "歷史篇", "ans": "B", "q": "王老師帶學生參觀高雄地區原住民的一項傳統慶典，慶典來到高潮時，男子將坐在鞦韆的女子一拉一牽，將女子盪高，當女子盪到最高點時，狀如空中飛人，令人驚心動魄。此過程，某種目的是讓青年男女相互認識、傳達情意。請問這是怎樣的慶典？", "options": ["布農族的射耳祭", "魯凱族的黑米祭", "小林夜祭", "鄒族的貝神祭。"], "id": 171}, {"orig_id": 72, "category": "歷史篇", "ans": "A", "q": "該族人對百步蛇、雲豹非常敬重，在他們的神話傳說中有許多關於百步蛇的傳聞，如百步蛇是頭目的祖先、是長老。對於百步蛇也有很多的禁忌，如儘量避免與它接觸。百合花象徵純潔與善獵，只有純潔的女子與英勇的獵人，才有資格戴上百合花。以上族群特質的描述是指那一族群？", "options": ["魯凱族", "排灣族", "布農族", "鄒族。"], "id": 172}, {"orig_id": 73, "category": "歷史篇", "ans": "D", "q": "每年族人於整地、播種前，男子圍成一圈，一起合唱「祈禱小米豐收歌」。族人相信，歌聲越好、天神越高興，小米就會結實累累。因此，每人都以虔敬的心唱著。這是指那個族群？", "options": ["魯凱族", "達悟族", "卑南族", "布農族。"], "id": 173}, {"orig_id": 74, "category": "歷史篇", "ans": "A", "q": "傳統西拉雅族社會中，每一個部落會有一位或多位的女巫師負責處理公眾的祭典事宜，稱為？", "options": ["尪姨", "乩童", "扶乩", "先生娘。"], "id": 174}, {"orig_id": 75, "category": "歷史篇", "ans": "D", "q": "早期布農族人以農耕狩獵生活，以小米為主要糧食。每年哪幾月之間，舉行「小米播種祭」，為了祈求小米能夠豐收，因此社裡的男子圍成一圈，一起合唱「祈禱小米豐收歌」？", "options": ["2～3 月", "4～5 月", "7～8 月", "11～12 月。"], "id": 175}, {"orig_id": 76, "category": "歷史篇", "ans": "D", "q": "相傳魯凱族人就是在多納的耕地發現黑米，並且以此養活了族人，為了紀念上天的恩賜與祈求來年的豐收，所以每年都會舉辦「黑米祭」。黑米祭典傳統都是在每年何時舉行？", "options": ["春天", "夏天", "秋天", "冬天。"], "id": 176}, {"orig_id": 77, "category": "歷史篇", "ans": "A", "q": "「牽手」一詞的由來，最普遍的說法是源於早期台灣哪一族的婚俗，意指男女成婚的儀式，後演變為妻子的稱呼？", "options": ["平埔族", "魯凱族", "鄒族", "布農族。"], "id": 177}, {"orig_id": 78, "category": "歷史篇", "ans": "D", "q": "小明班上進行高雄境内原住民族與祭典的專題報告，下列何者有誤？", "options": ["布農族-射耳祭", "鄒族-子安貝祭", "魯凱族-黑米祭", "泰雅族-飛魚祭。"], "id": 178}, {"orig_id": 79, "category": "歷史篇", "ans": "D", "q": "高雄平原的平埔族中，哪一個社在《熱蘭遮城日記》中譯本出現以前，從未出現在國內研究平埔族的文獻及著作中？", "options": ["大傑顛社", "阿加社", "尖山社", "搭加里揚社。"], "id": 179}, {"orig_id": 80, "category": "歷史篇", "ans": "A", "q": "「聖貝祭」(亦稱子安貝祭、貝神祭)是下列哪一族特有的祭典？傳說祖靈 藏在子安貝(殼)裡，平時收藏在一個小壺裡，到祭典時才拿出來供，其原意接近祖靈祭。", "options": ["南鄒族", "布農族", "魯凱族", "排灣族"], "id": 180}, {"orig_id": 81, "category": "歷史篇", "ans": "A", "q": "該族擁有精細的鞣皮技術，並以獵物皮作為衣飾為其特色，如帽子和皮鞋，請問這是哪個族群？", "options": ["鄒族", "布農族", "魯凱族", "排灣族。"], "id": 181}, {"orig_id": 82, "category": "歷史篇", "ans": "A", "q": "有關馬卡道族之敘述，何者為錯？", "options": ["馬卡道族得社會以男性為尊", "馬卡道族的社會以「社」為單元", "馬卡道族往往召集族人合力建屋", "男女都打赤腳。"], "id": 182}, {"orig_id": 83, "category": "歷史篇", "ans": "C", "q": "小明就讀旗山國小，因社會老師的作業要求而前往旗山戶政事務所查閱其祖先的戶籍資料，後來發現，其太祖的戶籍上有註記「熟」字，試問：小明的祖先應該是那個族群？", "options": ["福佬族群", "客家族群", "平埔族群", "高山原住民族群。"], "id": 183}, {"orig_id": 84, "category": "歷史篇", "ans": "A", "q": "魯凱族以百步蛇為祖靈，在高雄主要分佈於哪一個地區？", "options": ["茂林區", "那瑪夏區", "六龜區", "甲仙區。"], "id": 184}, {"orig_id": 85, "category": "歷史篇", "ans": "C", "q": "荷蘭人曾二度占領澎湖，但之後撤離轉往臺灣本島發展，原因為何？", "options": ["臺灣比起澎湖較有發展潛力", "西班牙人已佔領臺灣北部，荷蘭人不願落後", "澎湖當時為明帝國領土，遭明軍驅逐", "澎湖太小，不適宜做貿易據點。"], "id": 185}, {"orig_id": 86, "category": "歷史篇", "ans": "B", "q": "臺灣在明帝國中葉之後，逐漸成為各路海盜的根據地，與下列何者原因有關？", "options": ["明帝國派兵駐軍澎湖", "明帝國實施海禁政策", "在澎湖設立巡檢司", "澎湖地區的居民返回大陸。"], "id": 186}, {"orig_id": 87, "category": "歷史篇", "ans": "A", "q": "最早殖民統治高雄地區，獲取石灰石、漁業、柴薪、鹽等資源的是？", "options": ["荷蘭人", "西班牙人", "葡萄牙人", "日本人。"], "id": 187}, {"orig_id": 88, "category": "歷史篇", "ans": "D", "q": "荷蘭人統治臺灣期間，打狗海域已是臺灣重要的漁場，每年至少約有二百艘以上的漁船前來。打狗因而成為當時漁業中心之一，當時在每年的十一月至隔年的一月間，主要是哪種魚類的漁汛期？", "options": ["鮪魚", "沙丁魚", "鬼頭刀魚", "烏魚。"], "id": 188}, {"orig_id": 89, "category": "歷史篇", "ans": "A", "q": "荷蘭統治臺灣時期，漁民繳交魚稅大抵為漁獲的十分之幾？", "options": ["一", "二", "三", "四。"], "id": 189}, {"orig_id": 90, "category": "歷史篇", "ans": "D", "q": "鄭成功開發臺灣時，所設置的萬年縣，以現今哪一個都市為主要範圍？", "options": ["台北市", "台中市", "台南市", "高雄市"], "id": 190}, {"orig_id": 91, "category": "歷史篇", "ans": "B", "q": "小明研究高雄地區的古地名，發現有「參軍庄」（官員私墾）與「仁武營」（軍屯）。這些名詞反映了明鄭時期特殊的土地制度。請問，下列何者不屬於明鄭時期的土地分類？", "options": ["均田", "官田", "文武官田", "營盤田"], "id": 191}, {"orig_id": 92, "category": "歷史篇", "ans": "C", "q": "哪一問題是鄭氏撤退臺灣之初，最需解決的問題？", "options": ["番漢衝突", "疫病猖獗", "軍需民糧", "荷人威脅。"], "id": 192}, {"orig_id": 93, "category": "歷史篇", "ans": "C", "q": "臺灣在荷蘭與明鄭時期拓墾面積有限，主要地區集中在何處？", "options": ["北部", "中部", "南部", "東部。"], "id": 193}, {"orig_id": 94, "category": "歷史篇", "ans": "B", "q": "鄭成功入台後，設置兩縣，當時的高雄平原地區屬於？", "options": ["天興縣", "萬年縣", "東寧縣", "鳳山縣。"], "id": 194}, {"orig_id": 95, "category": "歷史篇", "ans": "A", "q": "明鄭時期高雄地區的屯墾地可以區分為軍屯、官吏私墾和民墾等不同類型，其中地名為前鋒、後勁、左營、右衝、前鎮、仁武、角宿、援剿的均屬於？", "options": ["軍屯地", "官吏私墾地", "民墾地", "不一定。"], "id": 195}, {"orig_id": 96, "category": "歷史篇", "ans": "B", "q": "1661 年 5 月，鄭成功入臺後，隨即著手規劃地方行政區域，改赤崁地方為東都明京，置天興、萬年二縣，其中萬年縣縣治設於何地？", "options": ["左營", "二贊行", "岡山", "右昌。"], "id": 196}, {"orig_id": 97, "category": "歷史篇", "ans": "C", "q": "明鄭時期，臺灣設置一府二縣，若以現今地名而論，下列地區何者屬萬年縣?(甲)高雄(乙)大甲(丙)新營(丁)恆春(戊)屏東？", "options": ["甲乙丙", "甲乙", "甲丁戊", "甲丙丁"], "id": 197}, {"orig_id": 98, "category": "歷史篇", "ans": "C", "q": "明鄭時期實施兵農合一的屯墾制度，留下許多以「軍事編制」為名的地名。若「後勁」是指後勁鎮的墾地，那麼「右衝鎮」的墾地則位於今日的哪一行政區？", "options": ["前鎮區", "左營區", "楠梓區", "燕巢區。"], "id": 198}, {"orig_id": 99, "category": "歷史篇", "ans": "C", "q": "與明鄭時代屯墾有關的地名包括前鎮、前鋒、後勁、左營、右衝(昌)，當時在埤子頭(蓮池潭)設置管轄高雄地區的是？", "options": ["鳳山縣", "台灣縣", "萬年縣", "大員縣。"], "id": 199}, {"orig_id": 100, "category": "歷史篇", "ans": "D", "q": "根據 1696 年（康熙 35 年）編撰的《臺灣府志》，鳳山縣的縣治最初確定設在何處？", "options": ["下淡水溪", "打鼓山港", "下陂頭街", "興隆莊。"], "id": 200}, {"orig_id": 101, "category": "歷史篇", "ans": "C", "q": "清廷在臺灣領有初期不允許建城，是受到哪一個事件的影響，才在事後允許建土城或竹城以資捍衛？", "options": ["蔡牽攻擾鳳山", "許尚、楊良斌事件", "朱一貴事件", "林爽文事件。"], "id": 201}, {"orig_id": 102, "category": "歷史篇", "ans": "A", "q": "鳳山縣首代舊城是土城，於 1722 年（康熙 61 年）修築，是臺灣第一座城垣。請問當時修築土城的知縣是誰？", "options": ["劉光泗", "宋永清", "錢洙", "王瑛曾。"], "id": 202}, {"orig_id": 103, "category": "歷史篇", "ans": "D", "q": "1788 年（乾隆53 年），陜甘總督福康安奏准將鳳山縣城遷往下陂頭街（今鳳山），其主要考量不包括下列哪一項？", "options": ["原縣治（興隆庄）地勢低漥，容易被賊寇窺伺", "下陂頭街當時已有店屋數百間，遠比興隆庄繁榮", "興隆庄已殘破不堪，居民遷回意願不高", "新城距海口較遠，遇亂事時，難以兼顧防禦。"], "id": 203}, {"orig_id": 104, "category": "歷史篇", "ans": "C", "q": "哪一個事件導致鳳山縣城被攻陷、縣署衙門被焚毀殆盡，並最終促使清廷決定將縣治遷至下陂頭街？", "options": ["朱一貴事件", "蔡牽攻擾鳳山", "林爽文事件", "黃教反清。"], "id": 204}, {"orig_id": 105, "category": "歷史篇", "ans": "D", "q": "1825 年（道光 5 年）鳳山舊城（興隆莊）重修為石城時，所使用的主要建材為何？", "options": ["土塊與莿竹", "花崗岩與紅磚", "木材與瓦片", "咾咕石與三合土。"], "id": 205}, {"orig_id": 106, "category": "歷史篇", "ans": "D", "q": "西元 1826 年，左營石造舊城竣工，清廷本意是希望行政中心遷回防禦力更強的舊城。然而，鳳山縣官員與紳商最終卻選擇留在「下陂頭街」（新城），形成「有城無縣」的奇特現象。請問下列哪一項敘述不符合史實？", "options": ["舊城附近山區有盜匪盤據，威脅安全", "舊城人口稀少，生活條件不如新城", "舊城飲水不足，用水不便", "新城地勢險要防禦穩固，安全性優於舊城。"], "id": 206}, {"orig_id": 107, "category": "歷史篇", "ans": "A", "q": "清初客家人移民臺灣困難重重，傳統觀點認為與施琅對廣東潮、惠人民的偏見有關。根據施琅向清廷的奏摺，他主張限制該地居民渡臺的主要理由為何？", "options": ["該地居民一向為海盜的來源，積惡習未改", "擔憂他們會與在臺的明鄭舊部聯合", "清廷擔心閩粵械鬥的發生", "他們在臺灣西部的拓墾能力不如福佬人。"], "id": 207}, {"orig_id": 108, "category": "歷史篇", "ans": "B", "q": "清初高雄地區最重要的漢人拓墾模式之一『官庄』，其土地來源主要是什麼？", "options": ["清廷文武官員向官方申請『墾照』拓墾的無主地", "侵佔明鄭時期的營盤田及官吏私田。", "康熙皇帝敕賜給施琅的『靖海侯』永業", "向平埔族鳳山八社購買的土地。"], "id": 208}, {"orig_id": 109, "category": "歷史篇", "ans": "D", "q": "清代高雄地區的拓墾過程中，由墾戶（大租戶）招徠佃戶（小租戶）進行管理與耕種，形成『一田二主』的現象。請問『小租戶』的主要權利為何？", "options": ["享有土地的永久所有權", "須繳納大租給官府並管理耕種者", "只須繳納小租給大租戶，不必繳田賦", "具有永佃權，可將土地轉佃給耕種者（現耕戶）。"], "id": 209}, {"orig_id": 110, "category": "歷史篇", "ans": "D", "q": "在曹公圳修築之前，高雄地區的大多數農地因水力不足或欠缺，被稱作什麼？", "options": ["官田", "水田", "施侯田", "看天田。"], "id": 210}, {"orig_id": 111, "category": "歷史篇", "ans": "D", "q": "1837 年（道光 17 年），知縣曹謹引哪一條溪水，修建了曹公圳，以利灌溉田地？", "options": ["蓮池潭", "二層行溪", "打狗港", "下淡水溪。"], "id": 211}, {"orig_id": 112, "category": "歷史篇", "ans": "A", "q": "清代臺灣的單身青壯男性移民，因謀生不易、血氣方剛，容易因爭奪資源而引發械鬥，他們被俗稱為？", "options": ["羅漢腳", "客子", "現耕戶", "墾戶。"], "id": 212}, {"orig_id": 113, "category": "歷史篇", "ans": "D", "q": "在 1784 年（乾隆49 年）以前，清廷僅開放哪一個港口作為臺灣與大陸之間貿易的唯一合法『對渡口岸』？", "options": ["鹿港", "打狗港", "八里坌", "鹿耳門。"], "id": 213}, {"orig_id": 114, "category": "歷史篇", "ans": "C", "q": "清代打狗港周邊的蔗糖外銷盛行，其中一種製糖的經營方式稱為『牛掛廍』，其經營模式為何？", "options": ["由 10 至 15 人組成，以牛隻拖石磨的時間計算股份", "由 2 至 5 名富農組成，雇用經理人生產管理", "由蔗農 15 至 40人組成，各自提供牛隻、勞力並分擔設備開銷", "由大小租戶或資本家獨資，雇用經理人生產管理。"], "id": 214}, {"orig_id": 115, "category": "歷史篇", "ans": "B", "q": "1859 年（咸豐 9 年），天主教由郭德剛等人再度傳入打狗，並於 1863 年落成『玫瑰聖母堂』。請問他們屬於哪一個修會？", "options": ["耶穌會", "道明會", "聖方濟會", "長老教會。"], "id": 215}, {"orig_id": 116, "category": "歷史篇", "ans": "A", "q": "英國基督長老教會傳教士馬雅各醫師於 1865 年來到打狗後，隨即轉往臺南府城傳教卻遭到排擠和暴動。這起事件被稱為？", "options": ["看西街事件", "牡丹社事件", "羅妹號事件", "樟腦事件。"], "id": 216}, {"orig_id": 117, "category": "歷史篇", "ans": "B", "q": "1867 年（同治 6 年）發生的『羅妹號事件』，最終由哪一位美國駐廈門領事前往瑯橋（恆春）與當地原住民領袖卓杞篤達成協議？", "options": ["吉必勳（Gibson）", "李仙德（Charles W. Le Gendre）", "郇和（Robert Swinhoe）", "馬雅各（James Laidlaw Maxwell）"], "id": 217}, {"orig_id": 118, "category": "歷史篇", "ans": "A", "q": "為抵擋法軍侵臺，1884 年清法戰爭期間，臺灣兵備道劉璈在旗後砲台加築了哪一項設施以加強其防禦力？", "options": ["護牆與進子藥房", "大坪頂砲台", "港口（雄鎮北門）砲台", "磚石城垣。"], "id": 218}, {"orig_id": 119, "category": "歷史篇", "ans": "A", "q": "首任臺灣巡撫劉銘傳為加強防務，在打狗山興建了哪一座砲台，與旗後、港口砲台構成高、中、低三層防護網，護衛打狗港？", "options": ["大坪頂砲台", "億載金城", "滬尾砲台", "紅毛城。"], "id": 219}, {"orig_id": 120, "category": "歷史篇", "ans": "A", "q": "在日軍進駐臺南城時，臺南紳民為避免遭血腥鎮壓，央請了哪一位英國傳教士引導日軍進入臺南城？", "options": ["巴克禮", "郭德剛", "馬雅各", "甘為霖。"], "id": 220}, {"orig_id": 121, "category": "歷史篇", "ans": "A", "q": "清初移民來臺的客家人，最初在哪一帶替福佬人幫傭而為『佃農』，因此被稱為『客子』？", "options": ["臺南府城一帶", "高雄平原", "屏東平原的萬丹、新園", "濫濫庄。"], "id": 221}, {"orig_id": 122, "category": "歷史篇", "ans": "C", "q": "1868 年，臺灣爆發「樟腦事件」。起因是英國商人非法採購樟腦引發糾紛，隨後擴大為波及鳳山、埤頭等地的教案。在局勢失控後，英國政府指派哪一位署理領事指揮軍艦砲擊安平，並迫使清廷簽署《樟腦條約》，承認其傳教權利？", "options": ["李仙德（Charles W. Le Gendre）", "斯文豪（Robert Swinhoe）", "吉必勳（John Gibson）", "必麒麟（William A. Pickering）"], "id": 222}, {"orig_id": 123, "category": "歷史篇", "ans": "B", "q": "目前全台灣保存清朝古書院規模最大的是哪一座?", "options": ["萃文書院", "鳳儀書院", "道東書院", "振文書院。"], "id": 223}, {"orig_id": 124, "category": "歷史篇", "ans": "D", "q": "下列哪一項地景與1874 年（同治13 年）的牡丹社事件有歷史關聯?", "options": ["鳳山新城西門外的演武亭", "旗后燈塔", "西子灣戰備隧道", "雄鎮北門旗後砲臺。"], "id": 224}, {"orig_id": 125, "category": "歷史篇", "ans": "B", "q": "位於鼓山區哨船頭山上的紅磚洋樓，經文史考證後，其歷史用途為何？", "options": ["英國領事館：負責商務與領事事務。", "英國領事官邸：為領事居住與接待賓客的場所。", "打狗海關（稅務司）：清廷設置於岸邊，負責查驗進出口貨物。", "英商怡和洋行：民間貿易商號，負責鴉片與砂糖貿易。"], "id": 225}, {"orig_id": 126, "category": "歷史篇", "ans": "B", "q": "清末打狗開港後，天主教和基督教相繼傳入當時的鳳山縣地區。請問 下列何者與此階段傳教並無直接的歷史關聯？", "options": ["前金玫瑰聖母堂", "旗山聖若瑟天主堂", "長老教會鳳山教會", "萬金聖母聖 高雄，設高雄州下轄高雄郡和高雄街。請問當時高雄街役場設於？", "options": ["今日的鼓山分局所在位址", "今鼓波街代天宮五府千歲廟所在地", "舊高雄市政府(今歷史博物館)", "今永光行。"], "id": 268}, {"orig_id": 169, "category": "歷史篇", "ans": "D", "q": "日治時期哪個工人抗爭事件，是新文化協會指導下最具規模的抗爭活動，此事件「臺灣農組東港支部」、「臺北機公會」等都派人來到高雄支援？", "options": ["高雄淺野水泥廠工人罷工事件", "鳳山農民組合抗爭", "高雄機械工友會抗爭", "高雄鐵工所罷工事件。"], "id": 269}, {"orig_id": 170, "category": "歷史篇", "ans": "A", "q": "高雄設市與鳳山郡、岡山郡、旗山郡同屬「高雄州」管轄，這才大致確定 今大高雄市的區域範圍，請問這是在哪年？", "options": ["1924 年", "1949 年", "1945 年", "2010 年。"], "id": 270}, {"orig_id": 171, "category": "歷史篇", "ans": "B", "q": "臺灣文化協會是日治時期臺人非武裝抗日最早出現的組織，後因左右路線之爭分裂，是在下列哪一年？", "options": ["1895 年", "1927 年", "1931 年", "1945 年。"], "id": 271}, {"orig_id": 172, "category": "歷史篇", "ans": "C", "q": "鳳山農民組合成立剛開始最主要是為了和下列哪一個產業對抗？", "options": ["臺灣鳳梨罐頭共同販賣株式會社", "大永興業株式會社", "陳中和物產", "臺灣製糖。"], "id": 272}, {"orig_id": 173, "category": "歷史篇", "ans": "D", "q": "在日治時期的臺灣興盛一時的農民組合後來式微的主因是？", "options": ["臺灣民眾黨的大力抵制", "臺灣社會民意不再支持", "日本政府屈服於壓力，改進許多政策，因此無須再進行抗爭", "路線過於左傾激進而被取締。"], "id": 273}, {"orig_id": 174, "category": "歷史篇", "ans": "A", "q": "下列有關日治時期日本對臺灣的經濟發展政策何者正確？", "options": ["後期的政策為工業臺灣，農業南洋", "前期的工業臺灣政策是因為日本軍事擴張的需求", "前期的農業發展政策讓許多現代化工廠在高雄成立", "前期臺灣輸往日本的農產品以香蕉和鳳梨最為重要。"], "id": 274}, {"orig_id": 175, "category": "歷史篇", "ans": "B", "q": "日治初期為有效提升蔗糖產量日本總督府實施了許多政策，其中臺灣糖業革命性的轉變的代表糖廠是？", "options": ["新興製糖", "橋仔頭糖廠", "後壁林糖廠", "旗尾糖廠。"], "id": 275}, {"orig_id": 176, "category": "歷史篇", "ans": "C", "q": "日治時期，總督府決定啟動高雄港第三期築港工程最主要的原因是？", "options": ["縱貫鐵路選定高雄為終點站", "糖業貿易日漸發達", "因應戰爭需求", "第一期港口淤積嚴重。"], "id": 276}, {"orig_id": 177, "category": "歷史篇", "ans": "D", "q": "今日之鼓山區哈瑪星的高雄港站，是打狗的第二代火車站，完工後稱其為「打狗驛」，後因打狗改名為高雄，因此打狗驛也改稱為「高雄驛」，請問是在何年發生？", "options": ["1908 年", "1912 年", "1918 年", "1920 年。"], "id": 277}, {"orig_id": 178, "category": "歷史篇", "ans": "A", "q": "1908 年建成的打狗驛，其建火車站的土地是如何取得？", "options": ["抽砂填海造陸", "拆遷新濱町的倉庫用地", "徵收附近民房", "徵收哈瑪星當地的鹽場。"], "id": 278}, {"orig_id": 179, "category": "歷史篇", "ans": "B", "q": "日治時代布農族抗日領袖，也是日警眼中的「兇蕃之王」、「理蕃之癌｣的原住民人物是？", "options": ["吉娃斯阿莉", "拉馬達星星", "莫那魯道", "馬躍比吼"], "id": 279}, {"orig_id": 180, "category": "歷史篇", "ans": "D", "q": "1908 年10 月臺灣縱貫鐵路完工通車，試問當時臺灣鐵路最南端的車站是？", "options": ["今高雄火車站", "已停用的臺鐵三塊厝站", "臺鐵橋頭站", "今打狗鐵道故事館。"], "id": 280}, {"orig_id": 181, "category": "歷史篇", "ans": "A", "q": "日治時期，隨著高雄港的繁榮，人口也快速成長，原本的高雄驛不敷使用，因此在1936 年興建新火車站，請問此火車站建於何地？", "options": ["大港埔", "橋仔頭", "哈瑪星", "鳳山。"], "id": 281}, {"orig_id": 182, "category": "歷史篇", "ans": "B", "q": "哈瑪星鐵道文化園區原為高雄港站，是高雄第一個火車站，為高雄當時開啟了海陸聯運的發展。二次大戰時，火車站不幸遭受空襲摧毀，在經過簡易整修後，高雄港站如今以打狗鐵道故事館的全新面貌呈現。請問:哈瑪星是在高雄市的哪一區？", "options": ["旗津區", "鼓山區", "鹽埕區", "苓雅區。"], "id": 282}, {"orig_id": 183, "category": "歷史篇", "ans": "C", "q": "日本殖民政府於明治年間曾對抗日份子，以激烈的「無差別掃蕩」、「清庄」等方式，集體屠殺全村15 歲以上男子，結果造成數千人死亡、數千戶房屋毀壞，以致當時在臺灣的外國傳教士集體向香港每日新聞投書抗議，引起國際注意的是？", "options": ["甲仙埔事件後的報復行動", "西來庵事件後的報復行動", "阿公店大虐殺事件", "霧社事件。"], "id": 283}, {"orig_id": 184, "category": "歷史篇", "ans": "D", "q": "日治時期高雄的鐵路建設積極進行，1908 年（明治41 年）10 月新建打狗驛完工啟用，此時打狗至基隆的縱貫線鐵路也同時完工通車。請問打狗驛是今？", "options": ["大港埔火車站", "橋頭火車站", "後驛火車站", "高雄港車站。"], "id": 284}, {"orig_id": 185, "category": "歷史篇", "ans": "D", "q": "南部的鐵道建設是隨著產業需求逐步向南延伸。關於日治時期南台灣鐵道的開發，下列哪一段區間的全線通車時間最晚？", "options": ["縱貫線（基隆至高雄間全線通車）", "鳳山支線（打狗至鳳山間通車）", "屏東線（鳳山至屏東間，含下淡水溪鐵橋竣工）", "枋寮線（屏東至枋寮間全線通車）"], "id": 285}, {"orig_id": 186, "category": "歷史篇", "ans": "B", "q": "1943 年，日本海軍為了支應南進政策的燃料需求，在高雄設立了「日本海軍第六燃料廠」。請問該廠的主廠區位於今日哪一地區，且戰後轉型為台灣重要的石油加工基地？", "options": ["紅毛港", "後勁", "前鎮港", "哈瑪星。"], "id": 286}, {"orig_id": 187, "category": "歷史篇", "ans": "C", "q": "昭和14 年（1939 年）的高雄市役所是後來的舊高雄市政府，那棟建築物是今日的？", "options": ["高雄願景館", "打狗鐵道故事館", "高雄歷史博物館", "高雄文學館。"], "id": 287}, {"orig_id": 188, "category": "歷史篇", "ans": "A", "q": "昭和10 年（1935 年）高雄地區最大的工廠設立，產品的供應，可提供製造成軍機的骨架。其顛峰時期員工近四千人。上述敘述所指的是哪家會社位於高雄的工廠？", "options": ["日本鋁業株式會社", "臺灣鐵工所株式會社", "三菱重工株式會社", "淺野水泥株式會社。"], "id": 288}, {"orig_id": 189, "category": "歷史篇", "ans": "A", "q": "在今日大高雄轄區内，日治時期的糖廠有？", "options": ["橋仔頭、後壁林、旗尾", "橋仔頭、後壁林、車路墘", "橋仔頭、旗尾、灣裡", "橋仔頭、旗尾、三崁店。"], "id": 289}, {"orig_id": 190, "category": "歷史篇", "ans": "C", "q": "從日治初期至1912 年，高雄港第一期築港工程完工後的數年之間，打狗的政教中心治所皆是在何處？", "options": ["大港埔", "鳳山", "旗後", "左營。"], "id": 290}, {"orig_id": 191, "category": "歷史篇", "ans": "D", "q": "高雄市是我國的工業重鎮，尤其是日治末期日本海軍第六燃料廠的興建，奠定了戰後以中油公司高雄煉油廠為核心的石油化學工業，讓高雄工業發展邁入新的里程碑。請問下列何者並非高雄石油化學工業產業鏈的區域？", "options": ["仁武區", "大社區", "林園區", "大寮區。"], "id": 291}, {"orig_id": 192, "category": "歷史篇", "ans": "A", "q": "高雄市捷運系統中，西起鹽埕區高雄船渠臨海路，行經蓬萊商港區北側之五福、七賢路港口後，沿中正路東行至鳳山再到大寮機廠站之路線者，係屬哪條捷運路線？", "options": ["橘線", "紅線", "藍線", "黃線。"], "id": 292}, {"orig_id": 193, "category": "歷史篇", "ans": "B", "q": "日治時期大高雄地區的主要糖廠代表並且也是臺灣糖業革命性的轉變的代表糖廠是？", "options": ["明治製糖", "臺灣製糖", "鹽水港製糖", "東洋製糖。"], "id": 293}, {"orig_id": 194, "category": "歷史篇", "ans": "C", "q": "日治時期坐落於鹽埕町（今大勇路與五福路交叉口），並設有高雄第一座「指針式電梯」，與台北「菊元百貨」、台南「林百貨」齊名的百貨公司為何？", "options": ["遠東百貨", "林百貨", "吉井百貨", "森永百貨。"], "id": 294}, {"orig_id": 195, "category": "歷史篇", "ans": "D", "q": "日治時期，在高雄工商業蓬勃發展的同時也吸引了許多外來人口，其中在高雄港擔任碼頭工人的以哪個地區的人最多？", "options": ["臺東", "嘉義", "臺南", "澎湖"], "id": 295}, {"orig_id": 196, "category": "歷史篇", "ans": "B", "q": "日治時期，在1909 年完工並提供了高雄地區初期工業發展所需電力的發電廠是？", "options": ["鳳山水庫發電廠", "竹子門發電廠", "考潭發電廠", "興達火力發電廠。"], "id": 296}, {"orig_id": 197, "category": "歷史篇", "ans": "C", "q": "民國 50 年代，隨著全球海運進入「大型化」與「貨櫃化」時代，政府決定開闢高雄港第二港口。此一決策的最主要技術考量為何？", "options": ["第一港口行政效率低落，需另設行政區。", "第一港口航道狹窄且深度不足，大型船隻無法入港。", "第一港口受限於壽山屏障，無法擴展貨櫃轉運區。", "第一港口受限於旗津的觀光開發，必須將貨運遷離"], "id": 297}, {"orig_id": 198, "category": "歷史篇", "ans": "D", "q": "高雄市某地區每年固定在農曆三月廿三（媽祖聖誕）、八月十四（中秋前夕）及九月九（重陽節）舉辦大型趕集活動，稱為「籮筐會」。此活動最初是農民交易竹編農具、種苗與生活用品的市集，請問該地區為何？", "options": ["鳳山區", "左營區", "旗山區", "岡山區。"], "id": 298}, {"orig_id": 199, "category": "歷史篇", "ans": "A", "q": "1966 年，台灣設立了全球第一個結合免稅貿易與工業加工功能的特殊園區，帶動了台灣後來的經濟奇蹟。請問這座歷史性的園區坐落於高雄哪一個地區？", "options": ["前鎮區", "苓雅區", "三民區", "旗津區。"], "id": 299}, {"orig_id": 200, "category": "歷史篇", "ans": "B", "q": "高雄港為長條形的天然潟湖港口，為了因應全球航運大型化的需求，目前共開闢了幾個提供船隻進出的「航道出入口」？", "options": ["1 個", "2 個", "3 個", "4 個。"], "id": 300}, {"orig_id": 1, "category": "藝文篇", "ans": "A", "q": "在臺灣日治時期作家仍用日文創作時，是何人就應《橋》副刊之邀為葉石濤等人的作品進行中譯？", "options": ["林曙光", "楊青矗", "許成章", "鄭炯明。"], "id": 301}, {"orig_id": 2, "category": "藝文篇", "ans": "D", "q": "臺灣人自己撰寫的第一部臺灣文學史，曾獲臺美基金會人文成就獎、中國時報文化貢獻獎、真理大學臺灣作家牛津獎、高雄縣文學獎的是哪一本書籍？", "options": ["臺詩三百首", "臺華雙語辭典", "臺語注音讀本", "臺灣文學史綱。"], "id": 302}, {"orig_id": 3, "category": "藝文篇", "ans": "B", "q": "何人提倡「讓春天從高雄出發」，帶動了高雄的文化活動？", "options": ["曾貴海", "余光中", "黃文龍", "鄭炯明。"], "id": 303}, {"orig_id": 4, "category": "藝文篇", "ans": "A", "q": "以工人的背景，創作了一系列表達勞苦大眾生活與心聲的工人小說是哪一位作家？", "options": ["楊青矗", "曾貴海", "林曙光", "吳錦發。"], "id": 304}, {"orig_id": 5, "category": "藝文篇", "ans": "A", "q": "楊青矗所編著的臺語文學備受臺語研究同好的敬重，並多次獲獎，以下哪一本書籍不是他的？", "options": ["臺語文學選", "臺華雙語辭典", "臺語注音讀本", "臺詩三百首。"], "id": 305}, {"orig_id": 6, "category": "藝文篇", "ans": "D", "q": "小說家出身且在客家文化教育、臺灣文學推廣、臺灣社會運動有多所貢獻，書寫對象主要是農村與農民，擅長以寫實手法描繪家鄉的人、事、物的是哪一位作家？", "options": ["鍾理和", "鍾肇政", "鍾台妹", "鍾鐵民。"], "id": 306}, {"orig_id": 7, "category": "藝文篇", "ans": "B", "q": "下列哪一位作家開創了綠色寫作的風氣？", "options": ["吳晟", "曾貴海", "李敏勇", "許達然。"], "id": 307}, {"orig_id": 8, "category": "藝文篇", "ans": "C", "q": "擅長以電影手法處理小說場景，內容銳利深刻，描寫人物內心世界細膩感人，且有強烈的歷史感覺和濃厚的人道關懷的是哪一位作家？", "options": ["鍾理和", "葉石濤", "吳錦發", "曾貴海。"], "id": 308}, {"orig_id": 9, "category": "藝文篇", "ans": "B", "q": "描繪客家意象，有著對土地和族群的關懷，是曾貴海哪一部作品？", "options": ["被喚醒的河流", "原鄉•夜合", "浪濤上的島國", "白鳥之歌。"], "id": 309}, {"orig_id": 10, "category": "藝文篇", "ans": "A", "q": "曾在臺灣時報擔任記者的李進文寫出沙汕之島，古樸而懷舊，更寫出哪一個地方是打狗歷史源流之地？", "options": ["旗津", "鼓山", "旗山", "左營。"], "id": 310}, {"orig_id": 11, "category": "藝文篇", "ans": "A", "q": "縣市合併後高雄市政府擴大辦理什麼獎項的徵稿，文類除短篇小說、散文、新詩之外，鼓勵大高雄地區青年文學創作？", "options": ["打狗鳯邑文學獎", "高雄青年文學獎", "港都青年文學獎", "臺灣文學獎。"], "id": 311}, {"orig_id": 12, "category": "藝文篇", "ans": "D", "q": "「鳳邑文學獎」增設什麼紀念獎，突顯了臺灣本土作家之地位，更帶動了地方文學的創作風氣？", "options": ["曾貴海和李進文", "吳錦發和黃文龍", "鍾鐵民和楊青矗", "鍾理和及葉石濤。"], "id": 312}, {"orig_id": 13, "category": "藝文篇", "ans": "C", "q": "出身臺南著名的小說家，也是撰寫第一本臺灣文學史《臺灣文學史綱》的文學評論，後來將家眷遷往高雄左營（舊城），並於西元1967 年8 月，調任橋頭鄉甲圍國小教師，自此定居左營，曾榮獲國立成功大學的榮譽文學博士，下列何者為是？", "options": ["鍾肇政", "賴和", "葉石濤", "林海音。"], "id": 313}, {"orig_id": 14, "category": "藝文篇", "ans": "C", "q": "「右手寫詩，左手寫散文」的文學家，曾擔任中山大學文學院院長兼外文研究所所長，他別出心裁的為文藝季活動寫上題，「讓春天從高雄出發」的詩意代號不脛而走，帶動了高雄的文化活動，下列何者為是？", "options": ["王文華", "李家同", "余光中", "向陽。"], "id": 314}, {"orig_id": 15, "category": "藝文篇", "ans": "A", "q": "十二歲隨父母遷居高雄，他以本身的工人背景，創作了一系列表達勞苦大眾生活與心聲的工人小說，西元1969 年，發表《在室男》短篇小說，在文壇開始有了知名度，1987 年他出任臺灣筆會首屆會長，致力於推動臺語文教育，他所編著的「臺詩三百首」、「臺華雙語辭典」和「臺語注音讀本」等著作，備受臺語研究同好的敬重，並多次獲獎，下列何者為是？", "options": ["楊青矗", "楊牧", "白先勇", "東方白。"], "id": 315}, {"orig_id": 16, "category": "藝文篇", "ans": "B", "q": "自師大畢業後，進入高雄旗美高中教書，在客家文化教育、臺灣文學推廣、臺灣社會運動多所貢獻。小說家出身的他，書寫對象主要是農村與農民，擅長以寫實手法描繪家鄉的人、事、物，籌建鍾理和紀念館、成立美濃愛鄉協進會、創辦旗美社區大學等等，總以先進的思考與寬宏的氣度促成了臺灣文化的接軌與轉型，下列何者為是？", "options": ["鍾肇政", "鍾鐵民", "吳錦發", "曾貴海。"], "id": 316}, {"orig_id": 17, "category": "藝文篇", "ans": "D", "q": "高雄市美濃區客家人，努力在為土地、自然和原住民寫故事，開創了綠色寫作的風氣，小說內容銳利深刻，描寫人物內心世界細膩感人，擅長以電影手法處理小說場景，著有《放鷹》、《秋菊》、《春秋茶室》等，有強烈的歷史感覺和濃厚的人道關懷，並與環保人士籌組高雄市柴山自然公園促進會，下列何者為是？", "options": ["劉克襄", "廖鴻基", "陳月霞", "吳錦發。"], "id": 317}, {"orig_id": 18, "category": "藝文篇", "ans": "B", "q": "曾任《文學臺灣》雜誌社社長、高雄市立民生醫院內科主任、臺灣南社社長，創作文類有論述、詩和散文，以詩為主，著有《白鳥之歌》、《航向自由》、《二十封信》等詩選，初期呈現浪漫主義風格，筆調濃厚抒情，後期則兼具自我省思和社會批判，下列何者為是？", "options": ["施寄青", "曾貴海", "吳念真", "鍾肇政。"], "id": 318}, {"orig_id": 19, "category": "藝文篇", "ans": "D", "q": "看到當時臺灣南部的文化氣氛過於冷清，於是組成「高雄美術研究會」，並對臺灣的美術教育、美術風氣推動給予熱誠的關心與贊助，使沈寂的南臺灣畫壇有一塊豐美的水草地，成為南臺灣畫壇的靈魂人物，其作品《紅衣》及《魚店》製作中華民國郵票，其162 件作品寄藏高雄市立美術館，《阿里山日出》及《岩》設置於高雄市立美術館大廳長期展示，下列何者為是？", "options": ["盧明德", "盧雲生", "陳世明", "劉啟祥。"], "id": 319}, {"orig_id": 20, "category": "藝文篇", "ans": "B", "q": "幼年就讀於苓雅寮公學校（今苓洲國小），西元 1931 年他的《旗后福聚樓》獲校際展覽會首獎，同年他以《椰子》入選獨立美術協會首回展，次年以《下田港》再度入選，與劉啟祥共同創辦南部美術協會，每年舉辦「南部美展」，下列何者為是？", "options": ["陳幸婉", "張啟華", "鄭瓊娟", "蕭麗虹。"], "id": 320}, {"orig_id": 21, "category": "藝文篇", "ans": "A", "q": "他是高雄美濃畫家，也曾服務杏壇35 年後退休，持續繪畫創作並設立畫會，致力推廣美育、參與環保護鄉土運動，他以彩筆為美濃作史，創作一系列美濃風情圖畫，呈現美濃客家傳統風俗及文化內涵，下列何者為是？", "options": ["曾文忠", "鍾照彥", "曾淑玲", "陳秋妹。"], "id": 321}, {"orig_id": 22, "category": "藝文篇", "ans": "B", "q": "國立臺灣師範大學美術系畢業，曾執教於高雄市大仁國中、高雄中學，其作品中帶有強烈的個人色彩與社會人性批判關懷，擅長運用水墨多媒材，對地方自然、人文環境的關懷以及區域文化性格的養成推動著力甚深，是「砂島畫會聯展」、「心象畫會」與「高雄市現代畫學會」等藝術家社群的共同創立者，下列何者為是？", "options": ["施寄青", "洪根深", "吳念真", "鍾肇政。"], "id": 322}, {"orig_id": 23, "category": "藝文篇", "ans": "B", "q": "曾執教於高雄市，長年致力現代水墨畫創作及推廣教育、多媒材創作，推動高雄市現代繪畫運動，可說是南臺灣繪畫界的代表人物，出版畫冊2集，著作「邊陲風雲」一書， 以文字詳實記錄西元1970-1990 年間高雄市重要的藝術活動，下列何者為是？", "options": ["陳澄波", "洪根深", "劉錦堂", "林玉山。"], "id": 323}, {"orig_id": 24, "category": "藝文篇", "ans": "A", "q": "解嚴後高雄第一個立案的現代繪畫團體，關心文化政策及社會公共議題，推動藝術生態的健全化，以宣揚現代繪畫，提倡高雄市現代藝術創作為宗旨，對於現代藝術時代性、社會性精神的推展不遺餘力，學會長期透過活動的舉辦，將現代藝術帶入群眾生活，下列何者為是？", "options": ["高雄市現代畫學會", "高雄市藝術聯盟畫會", "高雄水彩畫會", "高雄市西瀛畫會。"], "id": 324}, {"orig_id": 25, "category": "藝文篇", "ans": "D", "q": "17 歲那年隨父親和四位兄弟南遷至高雄大樹，投入陶業生產的行列，所捏製的陶藝作品以實用為主，觀賞為輔，又以「生活陶」創作聞名，研創「紫雲燒」陶藝，即燒製過程中有源自於柴火、落灰所形成的流紋、火紋，以致陶器紋路如「紫火行雲」，因此被陶藝界喻為「紫雲」，下列何者為是？", "options": ["林葆家", "林洸沂", "林添福", "林昭地。"], "id": 325}, {"orig_id": 26, "category": "藝文篇", "ans": "A", "q": "生於高雄美濃，並長時間專研陶瓷化工，並於西元1987 年將陶瓷業帶回故鄉美濃，創立「美濃窯」，在這個素無陶瓷工業條件的環境裡，極力推展陶藝事業，落實鄉土文化教育的工作，並催生陶壁公共藝術，其創作的陶壁，從雕塑、分割、製模、上釉、燒結、組合等工序都顯示出場景壯闊、氣勢磅礡之勢，下列何者為是？", "options": ["朱邦雄", "鍾志順", "鍾瑩螢", "蕭為仁。"], "id": 326}, {"orig_id": 27, "category": "藝文篇", "ans": "A", "q": "在高雄旗津創立旗津窯並力求突破傳統的瓶頸，以現代人的精神開創符合時、地、人的作品，傳達「生活即是藝術，藝術即是生活」的理念。並藉由手創的陶作品，讓人們從識物、敬物進而產生惜物愛物的精神，這不僅落實了環保的根本意識，也因此能讓以文化為訴求的「陶瓷」落地生根，下列何者為是？", "options": ["沈亨榮", "王予帆", "余崑茂", "蕭為仁。"], "id": 327}, {"orig_id": 28, "category": "藝文篇", "ans": "D", "q": "陶藝家其創作作品融合東方陶瓷裝飾風格與西方造形表現特徵，發展出個人自我風格特色，對於現代陶藝發展具有深切影響，西元1980 年，遷居高雄並成立個人工作室，帶領其學生成立「好陶」團體，對於南臺灣陶瓷藝術的推廣不遺餘力，將現代陶藝創作觀念引入南臺灣，帶動了南部的學陶風氣，下列何者為是？", "options": ["陳韻芬", "章碧霞", "賴秀蓁", "楊文霓"], "id": 328}, {"orig_id": 29, "category": "藝文篇", "ans": "B", "q": "高雄市國樂團與高雄市交響樂團在西元2000 年後發展出的共同趨勢是？", "options": ["樂團定位均轉為業餘性質", "均從公立樂團轉型為財團法人", "均將主要表演場地移至室內小型空間", "均專注於國際巡迴演出。"], "id": 329}, {"orig_id": 30, "category": "藝文篇", "ans": "A", "q": "林生祥樂團與打狗歌謠隊在創作風格上，最主要的共同點是？", "options": ["皆以臺灣本土生活經驗與在地文化為基底", "著重宗教音樂             initQuizState();
        }

        // 開始隨機抽題挑戰
        function startRandomQuiz() {
            currentQuizMode = 'random';
            let pool = getUnplayedPool(currentCity);
            
            if (pool.length === 0) {
                alert('恭喜您！您已經完成一整輪抽題！系統已自動重新洗牌，開啟新一輪挑戰！');
                pool = resetUnplayedPool(currentCity);
            }

            // 洗牌算法 Fisher-Yates
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            const count = Math.min(50, pool.length);
            const pickedIndices = pool.slice(0, count);
            const remaining = pool.slice(count);

            saveUnplayedPool(currentCity, remaining);
            updateUnplayedCountDisplay();

            currentQuizQuestions = pickedIndices.map(idx => QUIZ_DATA[currentCity][idx]);
            initQuizState();
        }

        function initQuizState() {
            currentQuestionIndex = 0;
            score = 0;
            userWrongAnswers = [];
            hasAnsweredCurrent = false;
            
            showView('view-quiz');
            loadQuestion(0);
        }

        function promptExitQuiz() {
            if (confirm('確定要中斷測驗並返回選單嗎？目前的進度將不會保存。')) {
                showView('view-dashboard');
            }
        }

        // 載入題目
        function loadQuestion(index) {
            hasAnsweredCurrent = false;
            const q = currentQuizQuestions[index];
            const total = currentQuizQuestions.length;

            // 進度條
            const pct = Math.round((index / total) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('quiz-progress').innerText = `${index + 1} / ${total}`;

            // 題目文字
            const qTextEl = document.getElementById('question-text');
            let categoryBadge = '';
            if (q.category && currentCity === 'kaohsiung') {
                categoryBadge = `<span class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-md mr-2 font-bold align-middle">${q.category}</span>`;
            }
            qTextEl.innerHTML = `${categoryBadge}<span class="align-middle">${index + 1}. ${q.q}</span>`;

            // 選項按鈕
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const optKeys = ['A', 'B', 'C', 'D'];
            
            optKeys.forEach((key, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-400 bg-white hover:bg-indigo-50/40 flex items-center transition-all group cursor-pointer';
                btn.dataset.opt = key;
                btn.onclick = () => selectOption(key);
                btn.innerHTML = `
                    <span class="opt-badge w-8 h-8 rounded-lg bg-slate-100 group-hover:bg-indigo-100 text-slate-700 group-hover:text-indigo-600 font-bold flex items-center justify-center mr-3 transition-colors shrink-0">${key}</span>
                    <span class="opt-text text-slate-700 font-medium text-base md:text-lg flex-grow leading-relaxed">${q.options[idx]}</span>
                `;
                container.appendChild(btn);
            });

            // 隱藏回饋區
            const fbContainer = document.getElementById('feedback-container');
            fbContainer.classList.add('hidden-view');

            // 下一題按鈕文字
            const btnNext = document.getElementById('btn-next');
            btnNext.innerText = (index === total - 1) ? '查看測驗結果 🏆' : '下一題 ❯';
        }

        // 點選選項
        function selectOption(selectedOpt) {
            if (hasAnsweredCurrent) return;
            hasAnsweredCurrent = true;

            const q = currentQuizQuestions[currentQuestionIndex];
            const isCorrect = (selectedOpt === q.ans);
            const optKeys = ['A', 'B', 'C', 'D'];

            // 鎖定所有選項按鈕
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                const optKey = btn.dataset.opt;
                const badge = btn.querySelector('.opt-badge');

                if (optKey === q.ans) {
                    btn.classList.add('correct-ans');
                    if (badge) badge.classList.add('correct-badge');
                } else if (optKey === selectedOpt && !isCorrect) {
                    btn.classList.add('wrong-ans');
                    if (badge) badge.classList.add('wrong-badge');
                } else {
                    btn.classList.add('faded');
                }
            });

            // 回饋區設定
            const fbContainer = document.getElementById('feedback-container');
            const fbIcon = document.getElementById('feedback-icon');
            const fbMsg = document.getElementById('feedback-message');

            fbContainer.classList.remove('hidden-view');

            if (isCorrect) {
                score++;
                fbContainer.className = 'rounded-2xl p-5 md:p-6 flex flex-col md:flex-row justify-between items-center border-2 transition-all bg-emerald-50 border-emerald-300 text-emerald-800';
                fbIcon.className = 'w-8 h-8 rounded-full flex items-center justify-center mr-3 bg-emerald-500 text-white shrink-0';
                fbIcon.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                fbMsg.innerHTML = '<span>答對了！太厲害了！</span>';
            } else {
                userWrongAnswers.push({
                    q: q,
                    index: currentQuestionIndex + 1,
                    selected: selectedOpt,
                    correct: q.ans
                });
                fbContainer.className = 'rounded-2xl p-5 md:p-6 flex flex-col md:flex-row justify-between items-center border-2 transition-all bg-rose-50 border-rose-300 text-rose-800';
                fbIcon.className = 'w-8 h-8 rounded-full flex items-center justify-center mr-3 bg-rose-500 text-white shrink-0';
                fbIcon.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>';
                
                const correctIdx = optKeys.indexOf(q.ans);
                const correctText = q.options[correctIdx];
                fbMsg.innerHTML = `<span>答錯了！正確答案是 <span class="bg-rose-200/80 px-2 py-0.5 rounded font-black">(${q.ans}) ${correctText}</span></span>`;
            }

            // 更新進度條
            const total = currentQuizQuestions.length;
            const pct = Math.round(((currentQuestionIndex + 1) / total) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        // 下一題
        function nextQuestion() {
            if (!hasAnsweredCurrent) return;
            if (currentQuestionIndex + 1 < currentQuizQuestions.length) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                showResults();
            }
        }

        // 結算結果
        function showResults() {
            const total = currentQuizQuestions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('result-score').innerText = accuracy + ' 分';
            document.getElementById('result-accuracy').innerText = accuracy + '%';
            document.getElementById('result-correct').innerText = score + ' 題';
            document.getElementById('result-wrong').innerText = (total - score) + ' 題';

            const titleEl = document.getElementById('result-title');
            const subEl = document.getElementById('result-subtitle');

            if (accuracy === 100) {
                titleEl.innerText = '太震撼了！全對滿分 🌟';
                subEl.innerText = '您的文史造詣登峰造極，教甄初試必拿高分！';
            } else if (accuracy >= 90) {
                titleEl.innerText = '表現優異！成績斐然 🏆';
                subEl.innerText = '基礎非常扎實，距離滿分只有一步之遙！';
            } else if (accuracy >= 70) {
                titleEl.innerText = '恭喜及格！持續精進 👏';
                subEl.innerText = '多練習幾次錯題，就能更加熟練穩定！';
            } else {
                titleEl.innerText = '再接再厲！熟能生巧 💪';
                subEl.innerText = '文史題庫需要反覆多刷幾次，檢視錯題再戰一次吧！';
            }

            // 錯題檢視按鈕
            const wrongBtn = document.getElementById('btn-toggle-wrong');
            const wrongCountBadge = document.getElementById('wrong-count-badge');
            const reviewContainer = document.getElementById('wrong-review-container');
            reviewContainer.classList.add('hidden-view');

            if (userWrongAnswers.length > 0) {
                wrongBtn.classList.remove('hidden');
                wrongCountBadge.innerText = userWrongAnswers.length;
                renderWrongList();
            } else {
                wrongBtn.classList.add('hidden');
            }

            showView('view-result');
        }

        function toggleWrongReview() {
            const container = document.getElementById('wrong-review-container');
            container.classList.toggle('hidden-view');
            if (!container.classList.contains('hidden-view')) {
                container.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function renderWrongList() {
            const listEl = document.getElementById('wrong-list');
            listEl.innerHTML = '';
            const optKeys = ['A', 'B', 'C', 'D'];

            userWrongAnswers.forEach(item => {
                const q = item.q;
                const correctIdx = optKeys.indexOf(item.correct);
                const userIdx = optKeys.indexOf(item.selected);

                const card = document.createElement('div');
                card.className = 'bg-slate-50 border border-slate-200 rounded-xl p-5 shadow-sm';
                card.innerHTML = `
                    <div class="font-bold text-slate-800 text-base mb-3 leading-relaxed">
                        <span class="inline-block bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded mr-2 font-mono">第 ${item.index} 題</span>
                        ${q.q}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm mt-3 pt-3 border-t border-slate-200">
                        <div class="text-rose-700 bg-rose-50 p-2.5 rounded-lg border border-rose-100 flex items-center">
                            <span class="font-bold mr-2">您的作答：</span>
                            <span>(${item.selected}) ${q.options[userIdx]}</span>
                        </div>
                        <div class="text-emerald-700 bg-emerald-50 p-2.5 rounded-lg border border-emerald-100 flex items-center">
                            <span class="font-bold mr-2">正確答案：</span>
                            <span>(${item.correct}) ${q.options[correctIdx]}</span>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function retryCurrentQuiz() {
            initQuizState();
        }

        // 鍵盤快速鍵支援
        document.addEventListener('keydown', (e) => {
            const quizView = document.getElementById('view-quiz');
            if (quizView.classList.contains('hidden-view')) return;

            const key = e.key.toUpperCase();
            if (!hasAnsweredCurrent) {
                if (['1', 'A'].includes(key)) selectOption('A');
                else if (['2', 'B'].includes(key)) selectOption('B');
                else if (['3', 'C'].includes(key)) selectOption('C');
                else if (['4', 'D'].includes(key)) selectOption('D');
            } else {
                if (key === 'ENTER' || key === ' ' || key === 'ARROWRIGHT') {
                    e.preventDefault();
                    nextQuestion();
                }
            }
        });
    </script>
</body>
</html>
