<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文史題庫刷題系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden-view { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 選項按鈕狀態樣式 */
        .option-btn { transition: all 0.2s ease; }
        .option-btn:disabled { cursor: not-allowed; }
        .correct-ans { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .correct-badge { background-color: #22c55e !important; color: white !important; }
        .wrong-ans { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .wrong-badge { background-color: #ef4444 !important; color: white !important; }
        .faded { opacity: 0.5; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 主容器 -->
    <div class="max-w-4xl mx-auto p-4 py-8">
        
        <!-- 視圖 1：首頁 (選擇縣市) -->
        <div id="view-home" class="flex flex-col items-center justify-center min-h-[80vh] fade-in">
            <div class="text-center mb-12">
                <span class="inline-block p-4 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </span>
                <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight">文史題庫刷題系統</h1>
                <p class="text-slate-500 mt-4 text-lg">請選擇您要練習的縣市題庫</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                <button onclick="selectCity('tainan')" class="group bg-white hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-300 rounded-2xl p-8 shadow-sm flex flex-col items-center transition-all transform hover:-translate-y-1">
                    <span class="text-4xl font-black text-blue-600 mb-2 group-hover:scale-110 transition-transform">臺南市</span>
                    <span class="text-slate-500 font-medium bg-slate-100 px-4 py-1 rounded-full text-sm mt-2">共 300 題 / 6 組</span>
                </button>
                <button onclick="selectCity('kaohsiung')" class="group bg-white hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-300 rounded-2xl p-8 shadow-sm flex flex-col items-center transition-all transform hover:-translate-y-1">
                    <span class="text-4xl font-black text-emerald-600 mb-2 group-hover:scale-110 transition-transform">高雄市</span>
                    <span class="text-slate-500 font-medium bg-slate-100 px-4 py-1 rounded-full text-sm mt-2">共 400 題 / 8 組</span>
                </button>
            </div>
        </div>

        <!-- 視圖 2：控制面板 (選擇題組/隨機) -->
        <div id="view-dashboard" class="hidden-view fade-in">
            <button onclick="showView('view-home')" class="flex items-center text-slate-500 mb-6 hover:text-indigo-600 font-medium transition-colors">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                返回首頁切換縣市
            </button>
            
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-8">
                <h2 id="dashboard-title" class="text-3xl font-bold text-slate-800 mb-2 md:mb-0"></h2>
                <span id="total-q-badge" class="bg-indigo-100 text-indigo-800 px-4 py-1.5 rounded-full font-bold shadow-sm"></span>
            </div>
            
            <!-- 循序練習區 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8">
                <div class="flex items-center mb-6 border-b border-slate-100 pb-4">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800">循序練習 (每 50 題一組)</h3>
                </div>
                <div id="set-buttons" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- JavaScript 動態生成按鈕 -->
                </div>
            </div>

            <!-- 隨機抽題區 -->
            <div class="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-2xl shadow-sm border border-indigo-100 p-6 md:p-8 text-center relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10">
                    <svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1010 10A10.011 10.011 0 0012 2zm0 18a8 8 0 118-8 8.009 8.009 0 01-8 8z"/></svg>
                </div>
                
                <h3 class="text-2xl font-bold mb-3 text-indigo-900 relative z-10">隨機抽題挑戰</h3>
                <p class="text-slate-600 mb-6 relative z-10 max-w-lg mx-auto">每次隨機抽取 50 題。抽過的題目在跑完一輪前不會重複出現，助您完整複習所有題庫！</p>
                
                <div class="bg-white inline-block px-6 py-3 rounded-full shadow-sm mb-6 border border-slate-100 relative z-10">
                    <span class="font-medium text-slate-600">剩餘未抽：</span>
                    <span id="unplayed-count" class="font-black text-indigo-600 text-2xl mx-2">0</span>
                    <span class="font-medium text-slate-600">題</span>
                </div>
                <br>
                <button onclick="startRandomQuiz()" class="relative z-10 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 text-lg w-full md:w-auto">
                    🎲 隨機抽取 50 題
                </button>
                <button onclick="promptReshuffle()" class="relative z-10 mt-6 text-sm text-slate-500 hover:text-red-500 underline block mx-auto transition-colors font-medium">
                    重新洗牌 (重置抽題紀錄)
                </button>
            </div>
        </div>

        <!-- 視圖 3：測驗介面 -->
        <div id="view-quiz" class="hidden-view fade-in h-full flex flex-col">
            <!-- 頂部進度條 -->
            <div class="flex justify-between items-center mb-4">
                <button onclick="promptExitQuiz()" class="text-slate-500 hover:text-slate-800 font-medium flex items-center bg-white px-3 py-1.5 rounded-lg border shadow-sm">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    中斷
                </button>
                <div class="flex-grow mx-6">
                    <div class="bg-slate-200 h-2.5 w-full rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
                <span id="quiz-progress" class="font-mono bg-white border border-indigo-100 shadow-sm text-indigo-700 font-bold px-4 py-1.5 rounded-full text-sm whitespace-nowrap">
                    1 / 50
                </span>
            </div>
            
            <!-- 題目區 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-6 flex-grow">
                <h3 id="question-text" class="text-xl md:text-2xl font-bold leading-relaxed mb-8 text-slate-800">
                    <!-- 題目內容 -->
                </h3>
                <div id="options-container" class="space-y-3">
                    <!-- 選項按鈕動態生成 -->
                </div>
            </div>
            
            <!-- 回饋區域 -->
            <div id="feedback-container" class="hidden-view rounded-2xl p-5 md:p-6 flex flex-col md:flex-row justify-between items-center border-2 transition-all">
                <div class="flex items-center mb-4 md:mb-0">
                    <span id="feedback-icon" class="w-8 h-8 rounded-full flex items-center justify-center mr-3 text-white"></span>
                    <span id="feedback-message" class="font-bold text-lg md:text-xl"></span>
                </div>
                <button onclick="nextQuestion()" id="btn-next" class="bg-slate-800 hover:bg-slate-900 text-white px-8 py-3.5 rounded-xl font-bold shadow-md transition-all w-full md:w-auto">
                    下一題 ❯
                </button>
            </div>
        </div>

        <!-- 視圖 4：結果介面 -->
        <div id="view-result" class="hidden-view text-center py-16 bg-white rounded-3xl shadow-sm border border-slate-200 mt-10 fade-in">
            <div class="w-24 h-24 bg-yellow-100 text-yellow-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
            </div>
            
            <h2 id="result-title" class="text-3xl font-extrabold text-slate-800 mb-2">測驗完成！</h2>
            <p id="result-subtitle" class="text-slate-500 mb-8 text-lg">恭喜您完成了本次練習！</p>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-2xl mx-auto mb-8 px-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div class="text-xs font-semibold text-slate-400 mb-1">測驗得分</div>
                    <div id="result-score" class="text-3xl font-black text-indigo-600">0 分</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div class="text-xs font-semibold text-slate-400 mb-1">答對率</div>
                    <div id="result-accuracy" class="text-3xl font-black text-slate-800">0%</div>
                </div>
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                    <div class="text-xs font-semibold text-emerald-600 mb-1">答對題數</div>
                    <div id="result-correct" class="text-3xl font-black text-emerald-600">0</div>
                </div>
                <div class="bg-rose-50 p-4 rounded-xl border border-rose-100">
                    <div class="text-xs font-semibold text-rose-600 mb-1">答錯題數</div>
                    <div id="result-wrong" class="text-3xl font-black text-rose-600">0</div>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-4 px-4 mb-8">
                <button onclick="retryCurrentQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 text-base">
                    🔁 重新挑戰
                </button>
                <button id="btn-toggle-wrong" onclick="toggleWrongReview()" class="hidden bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold py-3.5 px-8 rounded-xl transition-all text-base">
                    📋 查看錯題解析 (<span id="wrong-count-badge">0</span>)
                </button>
                <button onclick="showView('view-dashboard')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 px-8 rounded-xl transition-all text-base">
                    返回題組列表
                </button>
                <button onclick="showView('view-home')" class="text-slate-400 hover:text-slate-600 font-medium py-3.5 px-6 rounded-xl transition-colors text-base">
                    返回縣市首頁
                </button>
            </div>

            <!-- 錯題檢視區 -->
            <div id="wrong-review-container" class="hidden-view text-left max-w-2xl mx-auto px-4 mt-8 border-t border-slate-100 pt-8">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold text-slate-800 flex items-center">
                        <span class="w-2.5 h-6 bg-rose-500 rounded-full mr-2"></span>
                        本次錯題解析
                    </h3>
                    <span class="text-sm text-slate-400">點擊即可快速對照</span>
                </div>
                <div id="wrong-list" class="space-y-4">
                    <!-- 動態生成錯題 -->
                </div>
            </div>
        </div>

    </div>

    <!-- 腳本區域 -->
    <script>
        // 題庫資料 (共 700 題：臺南市 300 題，高雄市 400 題)
        const QUIZ_DATA = {"tainan": [{"orig_id": 1, "category": "台南文史", "ans": "C", "q": "臺南府城有潘氏、陳氏兩大廟宇彩繪家族，下列何者是潘氏第一代藝師？", "options": ["潘麗水", "潘瀛洲", "潘春源", "潘岳雄。"], "id": 1}, {"orig_id": 2, "category": "台南文史", "ans": "C", "q": "下列哪一個文化園區，同時擁有大片的魚塭、鹽田、紅樹林、鳥類等生態資源，是臺南最具自然之美的遼闊土地？", "options": ["大鵬灣文化園區", "五條港文化園區", "臺江生態文化園區", "安平港國家歷史風景區。"], "id": 2}, {"orig_id": 3, "category": "台南文史", "ans": "B", "q": "清領時期，臺灣第一座官建佛寺開元寺於十八世紀曾經過哪位官員整修、捐辦寺產，留存「重修海會寺碑」、「捐建園業碑記」石碑，奠基該寺的格局？", "options": ["施琅", "蔣元樞", "王得祿", "曹謹。"], "id": 3}, {"orig_id": 4, "category": "台南文史", "ans": "D", "q": "市定民俗「喜樹萬皇宮龜醮」是臺南地區十分獨特的祭典，請問相傳「龜醮」的由來為何？", "options": ["聚落擲筊乞求米龜的文化", "聚落民眾以紅龜粿為祭祀供品", "聚落廟宇主祀龜神的動物崇拜", "聚落民眾分食海龜的地方傳說。"], "id": 4}, {"orig_id": 5, "category": "台南文史", "ans": "C", "q": "鄭氏政權立足臺灣後，滿清為阻絕鄭氏吸納的商貿資源和兵源，曾經在東南沿海實施何種政策？", "options": ["在沿海屯兵，加強軍備", "招降納叛，斷絕其海上交通網", "下遷界令，堅壁清野", "策反臺灣島內平埔族群，裡應外合。"], "id": 5}, {"orig_id": 6, "category": "台南文史", "ans": "B", "q": "日治時期在臺南曾發生數起規模大小不一的抗日事件，請問何人曾自封為「臺灣皇帝」？", "options": ["李阿齊", "羅臭頭", "余清芳", "江定。"], "id": 6}, {"orig_id": 7, "category": "台南文史", "ans": "B", "q": "府城「廟墓合一」的古蹟是", "options": ["孔子廟", "五妃廟", "竹溪寺", "開元寺。"], "id": 7}, {"orig_id": 8, "category": "台南文史", "ans": "B", "q": "清領時期臺灣府署「鴻指園」是由官廳改建，並將四合亭遺址改建之庭園，此一佈局工整的園林，是哪位官員的施政作為？", "options": ["蔣毓英", "蔣允焄", "蔣元樞", "徐宗幹。"], "id": 8}, {"orig_id": 9, "category": "台南文史", "ans": "A", "q": "1865 年英國基督教長老教會派往臺灣先在在臺南西門外看西街(今仁愛街)傳道兼行醫。至1867 年又於二老口街許厝，建立當時全臺第一所西醫院，當時負責的宣教師是？", "options": ["馬雅各醫師", "甘為霖牧師", "巴克禮牧師", "馬偕牧師。"], "id": 9}, {"orig_id": 10, "category": "台南文史", "ans": "D", "q": "「臺南轉運站」，在過往為陸軍兵工配件製造廠，俗稱「兵工場」，請問該地在清代是哪一個官署用地的遺址？", "options": ["臺灣道署衙門", "臺灣縣衙門", "臺灣府衙門", "臺灣總鎮署衙門。"], "id": 10}, {"orig_id": 11, "category": "台南文史", "ans": "C", "q": "於十九世紀末期從英國引進全臺灣第一架新式印刷機並印行許多白話字出版品的「聚珍堂」(新樓書房)舊址位於現在臺南市的哪裡？", "options": ["臺南女中", "臺南一中", "臺南神學院", "成功大學。"], "id": 11}, {"orig_id": 12, "category": "台南文史", "ans": "B", "q": "關於荷蘭人佔領臺灣的史實，以下何者有誤？", "options": ["曾攻佔澎湖，最後與明朝妥協，並接受明朝地方官員之建議而改佔領臺灣", "由非洲引進黃 s": "C", "q": "臺南市巴克禮公園是為了紀念巴克禮牧師一生對臺灣的奉獻。關於巴克禮牧師的敘述何項有誤？", "options": ["創辦臺南神學院", "推廣白話字(臺語羅馬字)", "死後遷回蘇格蘭埋葬", "曾翻譯臺語聖經。"], "id": 26}, {"orig_id": 27, "category": "台南文史", "ans": "C", "q": "「臺灣革命僧」林秋梧曾有詩作〈贈青年僧伽〉：「菩提一念證三千，省識時潮最上禪；體解如來無畏法，願同弱少鬥強權。」請問法號證峰的林秋梧，是在臺南哪一知名佛寺出家的？", "options": ["碧雲寺", "大仙寺", "開元寺", "彌陀寺。"], "id": 27}, {"orig_id": 28, "category": "台南文史", "ans": "B", "q": "由英國宣教師「余饒理(George Ede)」於1885 年成立的全臺第一所西式中學為當今之哪一所學校？", "options": ["聖功女中", "長榮中學", "臺南一中", "牛津學堂。"], "id": 28}, {"orig_id": 29, "category": "台南文史", "ans": "C", "q": "由英國宣教師於1887 年成立的「 臺南新樓長老教女學校」是當時全臺第一所西式女子中學。該校即為當今之哪一所學校？", "options": ["聖功女中", "臺南女中", "長榮女中", "淡水女學校。"], "id": 29}, {"orig_id": 30, "category": "台南文史", "ans": "C", "q": "在臺南傳教的「甘為霖」牧師於1888 年出版《新港腔馬太福音傳》。關於該書的敘述，何者正確？", "options": ["用拉丁文書寫", "用荷蘭文及英文對照", "用荷蘭文、平埔族群西拉雅語及英文對照", "用荷蘭文及馬卡道語對照。"], "id": 30}, {"orig_id": 31, "category": "台南文史", "ans": "B", "q": "「豌豆」一詞臺語發音為「扶蓮(荷仁)豆」，與「紅毛塗」是「紅毛仔」的「塗」一樣，其實是以下那一國傳入因發音走調的結果？", "options": ["西班牙", "荷蘭", "英國", "葡萄牙。"], "id": 31}, {"orig_id": 32, "category": "台南文史", "ans": "A", "q": "下列何者是位於臺南佳里北頭洋，俗稱「飛番墓」的墓主，其墓碑上刻有「父子面君三次」字樣？", "options": ["程天與", "張達京", "潘敦", "劉國軒。"], "id": 32}, {"orig_id": 33, "category": "台南文史", "ans": "A", "q": "以前臺南的老一輩的祖母、曾祖母過年過節做紅龜粿都會用「粿葉仔」做紅龜的用底。「粿葉仔」樹就是以下那一種海邊常見的樹？", "options": ["黃槿", "構樹", "茄冬樹", "朱槿。"], "id": 33}, {"orig_id": 34, "category": "台南文史", "ans": "B", "q": "請問下列何者「非」臺南特有陣頭？", "options": ["五虎平西陣", "宋江龍陣", "宋江鹿陣", "白鶴陣。"], "id": 34}, {"orig_id": 35, "category": "台南文史", "ans": "B", "q": "根據2003 年衛星影像地圖，臺灣本島的極西點位置在哪裡？", "options": ["臺南市的四草", "臺南市的頂頭額汕南方", "嘉義縣的布袋", "高雄市的茄萣。"], "id": 35}, {"orig_id": 36, "category": "台南文史", "ans": "A", "q": "臺南市最古老的地層出現在哪裡？", "options": ["關仔嶺到南化的烏山一帶", "七股潟湖", "草山月世界", "玉井谷盆地。"], "id": 36}, {"orig_id": 37, "category": "台南文史", "ans": "D", "q": "「漚汪」(Auong)在平埔族群西拉雅語中為「溪」之意，而漚汪溪是今日的哪一條河流？", "options": ["鹽水溪", "急水溪", "七股溪", "將軍溪。"], "id": 37}, {"orig_id": 38, "category": "台南文史", "ans": "B", "q": "清康熙年間入臺採硫礦的郁永河 (1645-？ )，所著《裨海紀遊》收錄〈臺海竹枝詞〉一詩：「鐵板沙連到七鯤，鯤身激浪海天昏；任教巨舶難輕犯，天險生成鹿耳門」，描述的對象是？", "options": ["倒風內海", "臺江內海", "下淡水溪海口", "黑水溝。"], "id": 38}, {"orig_id": 39, "category": "台南文史", "ans": "A", "q": "哪一條河流在乾隆16 年(1751)以前改道自汫水港流入倒風內海，對倒風內海的淤塞影響最大？", "options": ["八掌溪", "急水溪", "將軍溪", "二仁溪。"], "id": 39}, {"orig_id": 40, "category": "台南文史", "ans": "A", "q": "臺南市海邊存在不少如青鯤鯓、南鯤鯓等地名，請問「鯤鯓」指的是何種海岸地形？", "options": ["沙洲", "沙灘", "潟湖", "海埔新生地。"], "id": 40}, {"orig_id": 41, "category": "台南文史", "ans": "A", "q": "「宋江武陣」有宋江陣、金獅陣、白鶴陣、五虎平西陣、宋江鹿陣等等，是臺南極具特色的傳統表演藝術，其中「宋江鹿陣」僅出現於哪個區？", "options": ["六甲區", "西港區", "佳里區", "麻豆區。"], "id": 41}, {"orig_id": 42, "category": "台南文史", "ans": "D", "q": "烏山頭水庫是攔堵曾文溪的哪一條支流而形成的？", "options": ["大埔溪", "後堀溪", "菜寮溪", "官田溪。"], "id": 42}, {"orig_id": 43, "category": "台南文史", "ans": "B", "q": "清領時期基督教長老教會進入臺南開疆闢土並就地深耕傳教，以下哪位傳教士和臺南幾無關係？", "options": ["馬雅各(James Laidlaw Maxwell，1836-1921)", "馬偕(George Leslie Mackay，1844-1901)", "甘為霖 (William Campbell，1841-1921)", "巴克禮(Thomas Barclay，1849-1935)。"], "id": 43}, {"orig_id": 44, "category": "台南文史", "ans": "B", "q": "目前臺南市出土年代最早甕棺的是何種文化？", "options": ["大坌坑文化", "牛稠子文化", "大湖文化", "蔦松文化。"], "id": 44}, {"orig_id": 45, "category": "台南文史", "ans": "C", "q": "下列何者不是臺南三年一科具有文資身份的定期廟會？", "options": ["蕭壠香", "西港香", "學甲香", "土城香。"], "id": 45}, {"orig_id": 46, "category": "台南文史", "ans": "B", "q": "臺南歷史悠久，擁有極為多元的民間故事，下列何則傳奇神話係臺南所獨有？", "options": ["媽祖用裙襬接砲彈", "五王大戰囡仔公", "日本燒神明，愈燒愈大尊", "烏狗拔大杉，王爺顯神通。"], "id": 46}, {"orig_id": 47, "category": "台南文史", "ans": "C", "q": "以下何者的描述與「臺南運河」無關？", "options": ["日大正年間松本虎太所設計之水道", "臺南龍舟比賽競技之水道", "1951 年臺語歌〈安平追想曲〉的故事場景", "1956 年臺語片《運河殉情記》的故事場景。"], "id": 47}, {"orig_id": 48, "category": "台南文史", "ans": "C", "q": "府城五條港地區流傳俗諺：「蔡抵(tu)蔡，神主牌仔摃摃破」，述說泉州晉江蔡姓移民雖屬同鄉籍貫，但因爭搶地盤卻也毫不相讓，曾盤據下列哪二間宮廟劃定勢力範圍？", "options": ["南沙宮、水仙宮", "金華府、藥王廟", "崇福宮、聚福宮", "普濟殿、景福祠。"], "id": 48}, {"orig_id": 49, "category": "台南文史", "ans": "A", "q": "蕭壠社目前尚有舉辦阿立祖信仰文化「傳統夜祭」的地方為何？", "options": ["北頭洋公廨", "角帶圍公廨", "慈濟宮", "金唐殿。"], "id": 49}, {"orig_id": 50, "category": "台南文史", "ans": "A", "q": "根據17 世紀初文獻上的記載，西拉雅的男人主要從事什麼工作？", "options": ["戰鬥、狩獵", "耕種、捕魚", "耕種、貿易", "以上皆錯。"], "id": 50}, {"orig_id": 51, "category": "台南文史", "ans": "A", "q": "請問下列有關「臺鹽隆田儲運站」的敘述，何者有誤？", "options": ["興建於日治時期", "主要儲放七股與北門鹽場的產鹽", "利用臺糖機關車運送產鹽", "產鹽可透過臺鐵轉運到高雄港外銷。"], "id": 51}, {"orig_id": 52, "category": "台南文史", "ans": "A", "q": "鄭氏時期，哪一個人從福建引入新品種白甘蔗及製糖方法，並集中於嘉南推廣？", "options": ["陳永華", "郁永河", "劉永福", "施琅。"], "id": 52}, {"orig_id": 53, "category": "台南文史", "ans": "A", "q": "西元1672 年，英國在何地設立臺灣商館，使得臺南一地一直扮演著東亞貨物的集散地？", "options": ["安平", "曾文溪", "鹿耳門", "新營。"], "id": 53}, {"orig_id": 54, "category": "台南文史", "ans": "A", "q": "鄭氏時期，新豐里可以先各地而春耕，係因哪一個水利設施的功勞？", "options": ["弼衣潭", "草潭", "鯽魚潭", "荷蘭埤 (E)香洋潭。"], "id": 54}, {"orig_id": 55, "category": "台南文史", "ans": "C", "q": "善化慶安宮內設有哪個歷史人物的神像，每年中秋節都會舉行專祀祭典？", "options": ["鄭成功", "陳永華", "沈光文", "鄭經。"], "id": 55}, {"orig_id": 56, "category": "台南文史", "ans": "D", "q": "想要了解鄭氏時期的歷史，可以從下列哪些古籍中得到較詳實完整的資料？", "options": ["周鍾瑄《諸羅縣志》、黃叔璥《臺海使槎錄》", "孫元衡《赤崁集》、藍鼎元《東征集》", "高拱乾《臺灣府志》、郁永河《裨海記遊》", "江日昇《臺灣外記》、楊英《從征實錄(先王實錄)》。"], "id": 56}, {"orig_id": 57, "category": "台南文史", "ans": "B", "q": "「同群擔負行，野花頭插滿。」這是沈光文的詩句，旨在描述什麼？", "options": ["平埔族群勇士", "平埔族群婦女", "平埔族群孩童", "平埔族群的狩獵情形。"], "id": 57}, {"orig_id": 58, "category": "台南文史", "ans": "C", "q": "下列哪一個港口是清代初期， 臺南地區重要的經貿港口，也是兩岸間經貿往來的正口？", "options": ["麻豆港", "鹽水港", "鹿耳門", "倒風港。"], "id": 58}, {"orig_id": 59, "category": "台南文史", "ans": "C", "q": "下列哪一個地方是清代初期臺南地區重要的政治重心之一，諸羅縣衙門及北路參將衙門曾設於此？", "options": ["佳里", "善化", "佳里興", "新營。"], "id": 59}, {"orig_id": 60, "category": "台南文史", "ans": "D", "q": "清代時期，臺灣南北貿易輸出結構不同，各領風騷，臺南地區曾以哪一項作物而傲居全臺經濟中心？", "options": ["茶", "樟腦", "蕃薯", "甘蔗。"], "id": 60}, {"orig_id": 61, "category": "台南文史", "ans": "C", "q": "我們常說：「月有陰晴圓缺」，來描述生活的變化性。請問身為臺南地區的天文專業教師，你認為下列有關月相變化的描述，何者正確?", "options": ["中秋節一定是滿月", "月球公轉地球一圈稱為一個月", "地球照是因為地球反射陽光造成月球暗的一面可以被看見", "以上皆非。"], "id": 61}, {"orig_id": 62, "category": "台南文史", "ans": "B", "q": "下列哪一個地方是清代教化麻豆社人之社學所在？", "options": ["護濟宮", "文昌祠", "萬福宮", "關帝廟。"], "id": 62}, {"orig_id": 63, "category": "台南文史", "ans": "C", "q": "清代水利開發之後，對臺南地區農作經營影響最大且是農業生產結構的轉變，其中最重要的是哪一種農作物的栽培？", "options": ["玉米", "糖蔗", "稻作", "花生。"], "id": 63}, {"orig_id": 64, "category": "台南文史", "ans": "C", "q": "下面哪一項指標對於清代時期臺南地區宗族的發展具有象徵性意義？", "options": ["設立學堂", "參與地方事務", "成立祭祀公業", "經營產業。"], "id": 64}, {"orig_id": 65, "category": "台南文史", "ans": "A", "q": "清代臺南地區民變事件中，「張丙之亂」與「劉卻案」初始發生的地點，是今日臺南市哪一區？", "options": ["白河區", "善化區", "後壁區", "西港區。"], "id": 65}, {"orig_id": 66, "category": "台南文史", "ans": "C", "q": "近年來，臺南市政府配合中央積極推動的四大綠能主軸，不包含下列哪一項？", "options": ["鋰電池", "太陽光電", "地熱發電", "離岸風電。"], "id": 66}, {"orig_id": 67, "category": "台南文史", "ans": "A", "q": "十九世紀末四草砲臺是下列哪位官員於清英鴉片戰爭時修築籌勘的？", "options": ["姚瑩", "劉銘傳", "沈葆禎", "蔣元樞。"], "id": 67}, {"orig_id": 68, "category": "台南文史", "ans": "D", "q": "觀察清代臺南地區的民變，以郭光侯案與張丙案為例，可以發現以下哪一項是產生這兩案民變的最關鍵因素？", "options": ["祭拜神明不同之衝突", "漢番婚姻繼承土地之糾紛", "外國勢力介入", "吏治不良。"], "id": 68}, {"orig_id": 69, "category": "台南文史", "ans": "C", "q": "請問下列有關臺南「接官亭石坊」的敘述，何者有誤？", "options": ["所在古稱「鎮渡頭」", "所在位於五條港之「南河港」", "石坊旁有祈求行旅平安的「海神廟」", "該處原有供官員等待休息的官廳。"], "id": 69}, {"orig_id": 70, "category": "台南文史", "ans": "D", "q": "下列哪一個地名，不是因清代產業文化之故而得名？", "options": ["鹽行", "菁寮", "南廍", "麻豆。"], "id": 70}, {"orig_id": 71, "category": "台南文史", "ans": "A", "q": "清乾隆時期，臺南地區商業貿易鼎盛 ，因而產生幾個行郊密集的街市，南以臺南府城為最，北則以臺南市哪一個街市最為重要？", "options": ["鹽水港街", "麻豆街", "茅港尾街", "鐵線橋街。"], "id": 71}, {"orig_id": 72, "category": "台南文史", "ans": "C", "q": "「臺鹼安順廠污染案」是臺南環境汙染的重大事件，有關「臺鹼公司安順廠」的敘述，請問下列何者為「非」？", "options": ["最初是為配合戰爭需求所設置", "曾經擁有超過600 多甲鹽田", "戰後由臺鹽公司所接收及恢復生產", "過往在工場內有鐵道可通往永康地區。"], "id": 72}, {"orig_id": 73, "category": "台南文史", "ans": "D", "q": "下面哪一座不是臺南市境內標高1000 公尺以上的山？", "options": ["白河區大凍山", "南化區三角南山", "楠西區竹子尖山", "玉井區虎頭山。"], "id": 73}, {"orig_id": 74, "category": "台南文史", "ans": "D", "q": "同治3 年(1864 年)安平設海關正式開港通商，洋商隨即紛紛在此設立洋行，其中以「安平五洋行」，最負盛名。其中英國商社最為積極，下列洋行何者不是英國人所開設？", "options": ["德記洋行", "怡記洋行", "和記洋行", "東興洋行。"], "id": 74}, {"orig_id": 75, "category": "台南文史", "ans": "A", "q": "書院的出現，對於一地文教的發展，具有一定象徵性的意義，乾隆46 年(1781)，臺南市北路的鹽水港出現了哪一座書院，影響鹽水港地區文教的發展？", "options": ["奎壁書院", "海東書院", "南湖書院", "蓬壺書院。"], "id": 75}, {"orig_id": 76, "category": "台南文史", "ans": "B", "q": "清代臺南地區的哪一種信仰，可以反映出移墾開發時期，人們崇鬼尚巫懼其作祟及不忍其曝屍路野的民胞物與情懷？", "options": ["王爺信仰", "萬善公信仰", "土地公信仰", "玄天上帝信仰。"], "id": 76}, {"orig_id": 77, "category": "台南文史", "ans": "A", "q": "下列何者是最早記錄臺南地區平埔族群較為可信的中文文獻？", "options": ["《東番記》", "《諸番誌》", "《島夷誌略》", "《從征實錄》。"], "id": 77}, {"orig_id": 78, "category": "台南文史", "ans": "B", "q": "在嘉南大圳各項工程中，哪項工程最為艱鉅？", "options": ["烏山頭水庫工程", "烏山嶺隧道工程", "北幹線和南幹線給水工程", "濁水溪流域取水口工程。"], "id": 78}, {"orig_id": 79, "category": "台南文史", "ans": "B", "q": "在現今臺南市境內，溪南地區的糖廠多屬於日治時期哪個製糖會社的？", "options": ["明治製糖株式會社", "臺灣製糖株式會社", "大日本製糖株式會社", "鹽水港製糖株式會社。"], "id": 79}, {"orig_id": 80, "category": "台南文史", "ans": "A", "q": "七股鹽場的南鹽區主要是因應何種情況而建立的？", "options": ["為因應戰爭所引發的工業用鹽需求", "欲建立臺灣新式製鹽業", "欲阻斷中國鹽的進口", "為了供應日本與朝鮮用鹽之需要，故闢建的鹽區，即今七股鹽場1 至7區，別稱南鹽區。"], "id": 80}, {"orig_id": 81, "category": "台南文史", "ans": "B", "q": "請問下列有關直轄市定古蹟「臺南合同廳舍」的敘述，何者有誤？", "options": ["最初稱為「御大典紀念塔」", "日治時期為警察、消防及軍隊等單位的共同辦公廳舍", "戰後曾經為臺南空軍新生社的所在", "目前仍有消防分隊在此進駐。"], "id": 81}, {"orig_id": 82, "category": "台南文史", "ans": "D", "q": "日治時期，楊逵的哪篇作品被葉石濤《臺灣文學史綱》譽為「使臺灣新文學運動發展達到尖峰」？", "options": ["《鬥鬧熱》", "《臺灣連翹》", "《寒夜三部曲》", "《送報伕》。"], "id": 82}, {"orig_id": 83, "category": "台南文史", "ans": "A", "q": "日本時代曾往來於新化知母義等地作祀壺調查，並在雜誌《民俗臺灣》陸續發表〈阿立祖巡禮記〉、〈祀壺之村〉等文，描述1940 年代臺南地區的西拉雅祀壺信仰的研究學者？", "options": ["國分直一", "伊能嘉矩", "中村孝志", "金關丈夫。"], "id": 83}, {"orig_id": 84, "category": "台南文史", "ans": "B", "q": "「柳營王醮」為臺南市公告市定民俗，請問下列有關「柳營王醮」的敘述，何者有誤？", "options": ["過往柳營有「有醮無廟」之俗諺", "有隆重的王府行儀", "一般每三年舉行一次", "有送王「燒王船」的習俗。"], "id": 84}, {"orig_id": 85, "category": "台南文史", "ans": "A", "q": "清領時期五條港即曾舉辦划龍舟的活動，許南英有詩描述：「佛頭港裡鬥龍舟，擁擠行人到岸頭。」但到日治時期「扒龍船」卻被遷移到下列何處舉行？", "options": ["臺南運河", "二仁溪", "德慶溪", "竹溪。"], "id": 85}, {"orig_id": 86, "category": "台南文史", "ans": "B", "q": "臺南市獼猴自然生態保育區位於南化區的何處？", "options": ["大凍山", "烏山", "崁頭山", "梅嶺。"], "id": 86}, {"orig_id": 87, "category": "台南文史", "ans": "A", "q": "2008 年12 月14 日，原臺南縣政府於清王宮廣場，設置萬年縣治紀念碑，請問清王宮位於今日臺南市哪一行政區域內？", "options": ["仁德", "歸仁", "安定", "佳里。"], "id": 87}, {"orig_id": 88, "category": "台南文史", "ans": "A", "q": "享譽全球的保育鳥類黑面琵鷺，每年定期造訪臺南市何地潟湖？", "options": ["七股", "北門", "將軍", "佳里。"], "id": 88}, {"orig_id": 89, "category": "台南文史", "ans": "C", "q": "下列哪一臺南廟宇設有「葉王交趾陶文化館」？", "options": ["佳里金唐殿", "佳里震興宮", "學甲慈濟宮", "臺南大天后宮。"], "id": 89}, {"orig_id": 90, "category": "台南文史", "ans": "C", "q": "1624 年荷蘭佔據臺灣後，1625 年宋克長官(Marten Sonk)即請求巴達維亞(Batavia )招募各種華人工匠到臺灣支援當地發展，並積極延攬印尼華人甲必丹(頭家)到臺灣幫忙。其中對於開發臺灣甘蔗種植產業的頭家為？", "options": ["林六哥 (Lacko )", "何斌", "蘇鳴崗", "楊昆 (Jan Cong )。"], "id": 90}, {"orig_id": 91, "category": "台南文史", "ans": "B", "q": "下列哪一位女醫師，出身於臺南大內，並於當地開設懸壺醫院，長年服務該地民眾？", "options": ["許世賢", "楊玉女", "柯明點", "劉彩仁。"], "id": 91}, {"orig_id": 92, "category": "台南文史", "ans": "A", "q": "十九世紀末前來臺灣辦理牡丹社事件善後事宜的欽差大臣沈葆楨，曾聘請法國工程師設計，並拆用熱蘭遮城磚石築造的西式砲臺。是下列哪一個古蹟？", "options": ["二鯤鯓砲臺", "四草砲臺", "巽方砲臺", "安平小砲臺。"], "id": 92}, {"orig_id": 93, "category": "台南文史", "ans": "D", "q": "哪一種植物是平埔族群人用來插青、收驚的法器？", "options": ["苦楝", "香蕉", "圓仔花", "澤蘭。"], "id": 93}, {"orig_id": 94, "category": "台南文史", "ans": "C", "q": "西拉雅族的公廨裡用什麼器物來代表阿立祖？", "options": ["神像", "壁畫", "壺、瓶、甕等容器", "酒杯。"], "id": 94}, {"orig_id": 95, "category": "台南文史", "ans": "B", "q": "六甲區的寺廟中，哪一座寺廟具備佛、法、僧三寶，同時也是臺灣早期的佛門寶剎之一？", "options": ["恒安宮", "龍湖巖", "太子宮", "聖母廟。"], "id": 95}, {"orig_id": 96, "category": "台南文史", "ans": "B", "q": "將一生奉獻給烏腳病患，而贏得「烏腳病患之父」美譽的是哪位醫生？", "options": ["謝緯醫師", "王金河醫生", "孫理蓮女士", "以上皆非。"], "id": 96}, {"orig_id": 97, "category": "台南文史", "ans": "C", "q": "北門區漁塭養一種魚會游、會爬、會鑽、會跳的奇異魚類叫做什麼魚？", "options": ["虱目魚", "吳郭魚", "花跳魚", "鯉魚。"], "id": 97}, {"orig_id": 98, "category": "台南文史", "ans": "C", "q": "南鯤鯓廟主祀的主神是什麼？", "options": ["保生大帝", "媽祖", "五府千歲", "關公 (E)太子爺。"], "id": 98}, {"orig_id": 99, "category": "台南文史", "ans": "B", "q": "左鎮區為了推廣觀光旅遊與產業文化，增加鄉民的收入，促進鄉里繁榮，近年來積極辦理的活動是什麼？", "options": ["芒果節", "白堊節", "番薯節", "鳳梨節。"], "id": 99}, {"orig_id": 100, "category": "台南文史", "ans": "A", "q": "臺灣重要的化石產區，每逢大雨季節常沖刷出大量化石的地方，是在左鎮的哪裡？", "options": ["菜寮溪", "許縣溪", "二仁溪", "後堀溪。"], "id": 100}, {"orig_id": 101, "category": "台南文史", "ans": "B", "q": "玉井山區在荷蘭治理時期，是哪一族人的生活空間？", "options": ["布農族", "四社平埔", "阿美族", "噶瑪蘭族。"], "id": 101}, {"orig_id": 102, "category": "台南文史", "ans": "B", "q": "曾培植愛文芒果成功，是開創玉井芒果產業功臣，被尊稱為「芒果之父」的是誰？", "options": ["鄭芝龍", "鄭罕池", "余清芳", "鄭金川。"], "id": 102}, {"orig_id": 103, "category": "台南文史", "ans": "D", "q": "臺南府城哪一座廟宇又稱潮州會館？", "options": ["興濟宮", "海安宮", "風神廟", "三山國王廟。"], "id": 103}, {"orig_id": 104, "category": "台南文史", "ans": "B", "q": "手裡拿著拍板、琵琶、洞簫、二絃等樂器，彈唱一些優雅樂曲的「陣頭」是什麼？", "options": ["水族陣", "南管樂團", "十二婆姐", "金獅陣。"], "id": 104}, {"orig_id": 105, "category": "台南文史", "ans": "A", "q": "哪位藝術家的交趾陶作品，被譽為「臺灣絕技，東洋國寶」？", "options": ["葉王", "何金龍", "葉鬃", "李梅樹。"], "id": 105}, {"orig_id": 106, "category": "台南文史", "ans": "B", "q": "傳統的「粉間」是製造何種產品的工廠？", "options": ["發粉", "蕃薯粉", "米粉", "麵粉。"], "id": 106}, {"orig_id": 107, "category": "台南文史", "ans": "D", "q": "古早的碾米廠又叫做什麼？", "options": ["古亭", "煙間", "粉間", "土壠間。"], "id": 107}, {"orig_id": 108, "category": "台南文史", "ans": "C", "q": "全國規模最大的牛墟是在下列哪個地方？", "options": ["北港", "新化", "善化", "鹽水。"], "id": 108}, {"orig_id": 109, "category": "台南文史", "ans": "C", "q": "新化區內有一座臺灣最早興建的水庫，早已名列於臺灣十二勝景之一的風景區是指哪裡？", "options": ["冷水埤", "葫蘆埤", "虎頭埤", "尖山埤。"], "id": 109}, {"orig_id": 110, "category": "台南文史", "ans": "C", "q": "臺灣第一條開辦的糖廠客運火車，是從新營開向何處？", "options": ["善化", "佳里", "鹽水", "玉井。"], "id": 110}, {"orig_id": 111, "category": "台南文史", "ans": "D", "q": "哪一條不是新營區東部的三條活斷層？", "options": ["觸口斷層", "木屐寮斷層", "六甲斷層", "梅山斷層。"], "id": 111}, {"orig_id": 112, "category": "台南文史", "ans": "C", "q": "這幾年臺南市各區將產業與文化、觀光相結合，推出多元化行銷方式。下列哪一種產業特色敘述錯誤？", "options": ["白河蓮花節", "柳營牛奶節", "南寮米食節", "東山龍眼節。"], "id": 112}, {"orig_id": 113, "category": "台南文史", "ans": "D", "q": "下列哪一項慶典儀式，不是東山區吉貝耍平埔族群祭典儀式？", "options": ["獻豬", "哮海", "牽曲", "搶孤。"], "id": 113}, {"orig_id": 114, "category": "台南文史", "ans": "A", "q": "八掌溪畔設置許多石敢當，它的作用是什麼？", "options": ["鎮壓大水", "抵擋野獸", "求雨", "村落界址。"], "id": 114}, {"orig_id": 115, "category": "台南文史", "ans": "B", "q": "臺灣府城三大書院極富盛名，在參觀孔廟文化園區時，附近周邊的忠義國小即是下列哪一個書院的舊址？", "options": ["崇文書院", "海東書院", "蓬壺書院", "奎樓書院。"], "id": 115}, {"orig_id": 116, "category": "台南文史", "ans": "C", "q": "17 世紀中葉曾翻譯聖經馬太福音和約翰福音，並以黑體字的荷蘭文和羅馬拼音的新港文兩欄對照的荷蘭牧師？", "options": ["亨布魯克(Antonius Hambroek)", "尤紐斯 (Robertus Junius )", "倪但理 (Daniël Gravius )", "甘迪留斯( Georgius Candidius)。"], "id": 116}, {"orig_id": 117, "category": "台南文史", "ans": "B", "q": "目前臺南府城南門碑林的設置，開始於下列哪一次展覽會所收集、陳列的45 件古碑？", "options": ["1930 年臺灣文化三百年紀念會", "1935 年始政四十周年紀念臺灣博覽會", "1937 年臺南市歷史館開館展覽", "1946 年臺南歷史館重新開館展覽會。"], "id": 117}, {"orig_id": 118, "category": "台南文史", "ans": "B", "q": "楠西區最著名的農產品是什麼？", "options": ["荔枝", "楊桃", "芒果", "龍眼。"], "id": 118}, {"orig_id": 119, "category": "台南文史", "ans": "B", "q": "學甲出名的魚粥和魚丸是利用哪一種魚做成的？", "options": ["草魚", "虱目魚", "吳郭魚", "鯛魚。"], "id": 119}, {"orig_id": 120, "category": "台南文史", "ans": "A", "q": "歸仁區仁壽宮俗稱「歸仁大廟」，正門上的門神是哪位彩繪大師的作品？", "options": ["潘麗水", "李漢卿", "潘春元", "葉王。"], "id": 120}, {"orig_id": 121, "category": "台南文史", "ans": "C", "q": "臺南市位處嘉南平原幅員廣袤，其中有一條流灌其間，因河道擺盪變動劇烈，又被稱為「青盲(tshenn-mê)蛇」的是下列哪一條溪流？", "options": ["二仁溪", "鹽水溪", "曾文溪", "八掌溪。"], "id": 121}, {"orig_id": 122, "category": "台南文史", "ans": "D", "q": "臺南府城鷲嶺北極殿內「威靈赫奕」匾，是何人所題？", "options": ["鄭成功", "鄭經", "陳永華", "朱術桂。"], "id": 122}, {"orig_id": 123, "category": "台南文史", "ans": "B", "q": "新營太子宮廟前的天公爐，爐頂倒掛著百隻蝙蝠，它象徵著什麼？", "options": ["以德服人", "天降百福", "幅員遼闊", "五福臨門。"], "id": 123}, {"orig_id": 124, "category": "台南文史", "ans": "D", "q": "清領時期白河地區曾發生民眾「反教」衝突，出現迫害教徒、包圍焚燒教堂的「白水溪事件」，請問該事件與哪一位西方傳教士有關？", "options": ["馬偕", "巴克禮", "馬雅各", "甘為霖。"], "id": 124}, {"orig_id": 125, "category": "台南文史", "ans": "D", "q": "臺南古蹟「兌悅門」，這是府城西側所擴建的「外城」城門，請問府城「外城」的設置，主要與哪一個歷史事件有關？", "options": ["林爽文事件", "牡丹社事件", "樟腦戰爭", "海盜蔡牽事件。"], "id": 125}, {"orig_id": 126, "category": "台南文史", "ans": "C", "q": "下列哪一項不是「編竹夾泥牆」的建材？", "options": ["米糠土", "石灰", "磚頭", "竹片。"], "id": 126}, {"orig_id": 127, "category": "台南文史", "ans": "A", "q": "下列哪一座山，位於臺南白河與嘉義大埔交界處，是臺南第一高峰，標高1241 公尺？", "options": ["大凍山", "崁頭山", "烏山", "刣牛湖山。"], "id": 127}, {"orig_id": 128, "category": "台南文史", "ans": "B", "q": "在南科園區出土的文化遺址，以什麼最著名？", "options": ["大坌坑遺址", "蔦松文化遺址", "烏山頭文化遺址", "芝山岩文化遺址。"], "id": 128}, {"orig_id": 129, "category": "台南文史", "ans": "B", "q": "西拉雅族群慶祝太祖(阿立祖)生日的夜祭，會由一群少女穿著白衣、白裙，邊唱邊跳，西拉雅族群人稱這種儀式為何？", "options": ["唱向", "牽曲", "靈祭", "夜祭。"], "id": 129}, {"orig_id": 130, "category": "台南文史", "ans": "D", "q": "「惡地」 (青灰岩地形)所形成的月世界地景，具有觀光文化價值，2021年臺南市政府將製造炸藥的「龍崎工廠」周邊惡地，指定為自然保留區及地質公園，其位置在", "options": ["草山", "二寮", "龍船", "牛埔。"], "id": 130}, {"orig_id": 131, "category": "台南文史", "ans": "C", "q": "全臺面積最大的科學工業園區是哪一個？", "options": ["竹科", "中科", "南科", "東科。"], "id": 131}, {"orig_id": 132, "category": "台南文史", "ans": "D", "q": "新市曾經和麻豆文旦齊名的水果為何？", "options": ["西瓜", "鳳梨", "番茄", "蓮霧。"], "id": 132}, {"orig_id": 133, "category": "台南文史", "ans": "D", "q": "龍崎所舉辦的產業文化是什麼節？", "options": ["菜頭節", "蓮花節", "釋迦節", "采竹節。"], "id": 133}, {"orig_id": 134, "category": "台南文史", "ans": "A", "q": "學甲的「粉鳥揹笭」是農閒的民俗活動，其競賽對象以何為單位？", "options": ["村庄", "姓氏", "性別", "寺廟。"], "id": 134}, {"orig_id": 135, "category": "台南文史", "ans": "D", "q": "以下有關許丙丁先生說法何者為是？", "options": ["不僅擅長詩文漫畫創作，也精通南管、演戲等。", "完成《小封神》並編集成書，臻至文學創作之高峰。", "在音樂填詞上的才情有目共睹、有耳共聽，留下不少寶貴的填詞傑作，諸如〈思想起〉、〈丟丟銅仔〉、〈牛犁歌〉、〈六月茉莉〉、〈管芒花〉等。", "以上皆是。"], "id": 135}, {"orig_id": 136, "category": "台南文史", "ans": "D", "q": "以下對於楊逵的介紹，何者正確：", "options": ["是一位具有人道關懷的社會主義作家，及社會運動者。", "1948 年發表「和平宣言」，對不合理政策提出異議，被當時的國民政府逮捕，宣判長達12 年的牢獄生活。", "出獄後，1962 年在臺中購地建立了東海花園，耕讀自娛。", "以上皆是。"], "id": 136}, {"orig_id": 137, "category": "台南文史", "ans": "B", "q": "下列哪一新文學社團，是在1936 年由趙櫪馬、張慶堂、莊松林、鄭明、黃漂舟、董祐峰、徐阿壬等臺南人所成立的？", "options": ["風車詩社", "臺南藝術俱樂部", "青風會", "臺灣新文學。"], "id": 137}, {"orig_id": 138, "category": "台南文史", "ans": "A", "q": "國家古蹟「水道博物館」座落於哪一行政區？", "options": ["山上區", "玉井區", "龍崎區", "下營區。"], "id": 138}, {"orig_id": 139, "category": "台南文史", "ans": "D", "q": "說臺南市「是個適合人們做夢、幹活、戀愛、結婚、悠然過日子的好地方」─這句話的原作者為誰？", "options": ["吳晉淮", "賴清德", "吳新榮", "葉石濤。"], "id": 139}, {"orig_id": 140, "category": "台南文史", "ans": "B", "q": "日治時期以楊熾昌、張良典、林修二、李張瑞等人為創社同仁，首次將西方超現實主義文學思潮引進臺灣的詩社為何？", "options": ["創世紀詩社", "風車詩社", "現代派詩社", "龍族詩社。"], "id": 140}, {"orig_id": 141, "category": "台南文史", "ans": "D", "q": "以下關於「鹽分地帶文學」敘述，何者正確？", "options": ["是清領時期重要文學團體", "楊熾昌為「鹽分地帶文學」著名詩人", "以超現實意象描繪現代人內心之孤寂與徬徨", "作品展示了當地人民在與貧瘠的自然環境鬥爭中形成的勤勞樸實、堅韌不拔的性格和美德。"], "id": 141}, {"orig_id": 142, "category": "台南文史", "ans": "C", "q": "日治時期臺南州廳建物主體曾遭受空襲轟炸受損，戰後經整修一度為臺南市政府官廳，至2003 年再度修建完成，賦予「老建築新生命」，今為", "options": ["奇美博物館", "國立臺灣歷史博物館", "國立臺灣文學館", "臺南生活美學館館舍。"], "id": 142}, {"orig_id": 143, "category": "台南文史", "ans": "A", "q": "「鹽分地帶」重要古典詩人王炳南，曾作〈過夢蝶園〉一詩，敘寫其遊「夢蝶園」的心情、感觸；所遊之「夢蝶園」即今臺南", "options": ["法華寺", "竹溪寺", "開元寺", "妙心寺。"], "id": 143}, {"orig_id": 144, "category": "台南文史", "ans": "A", "q": "在臺南永康、歸仁一帶許多村落有所謂「分水餅」的習俗，請問有關「分水餅」的敘述，下列何者有誤？", "options": ["在幼童「度晬」時進行分餅", "水餅就是「水果餅」", "不分男女幼童皆可進行分餅習俗", "永康廣興宮擔餅節被列為市定民俗。"], "id": 144}, {"orig_id": 145, "category": "台南文史", "ans": "B", "q": "小說《鹽田兒女》以臺南鹽田為小說場景，其作者為", "options": ["蔡奇蘭", "蔡素芬", "蔡秀女", "蔡培火。"], "id": 145}, {"orig_id": 146, "category": "台南文史", "ans": "A", "q": "以臺南為起事地點，在臺灣歷史上成為臺灣人由武裝抗日轉為「文化抗日」之關鍵事件，作家李喬曾將之寫成長篇小說的抗日行動為何？", "options": ["《西來庵事件(亦稱噍吧哖事件)》", "《鴨母王事件》", "《林爽文事件》", "《廖添丁事件》。"], "id": 146}, {"orig_id": 147, "category": "台南文史", "ans": "B", "q": "對於沈光文的敘述，下列何者是錯誤的？", "options": ["曾任明朝太僕寺少卿官職", "著有《臺海使槎錄》", "曾在目加溜灣社教授平埔族群小孩漢文", "與友人組東吟社，堪稱是臺灣第一個詩社。"], "id": 147}, {"orig_id": 148, "category": "台南文史", "ans": "A", "q": "出身臺南佳里，著有〈亡妻記〉一文的「醫生作家」為誰？", "options": ["吳新榮", "王登山", "蔡瑞洋", "王受祿。"], "id": 148}, {"orig_id": 149, "category": "台南文史", "ans": "D", "q": "府城臺南有許多清代官方的「祀典廟宇」，請問下列何者「不」是官方祀典廟宇？", "options": ["風神廟", "延平郡王祠", "海神廟", "小南城隍廟。"], "id": 149}, {"orig_id": 150, "category": "台南文史", "ans": "B", "q": "臺南市政府目前發行的臺語文學刊物是", "options": ["《台灣學誌》", "《臺江文學》", "《台文戰線》", "《海翁文學》。"], "id": 150}, {"orig_id": 151, "category": "台南文史", "ans": "B", "q": "下列哪一位美術家紀念館，位於臺南柳營？", "options": ["顏水龍紀念館", "劉啟祥美術紀念館", "洪通紀念館", "漢寶德紀念館。"], "id": 151}, {"orig_id": 152, "category": "台南文史", "ans": "A", "q": "清同治年間，「府城三郊」(「南」、「北」、「糖」)開鑿「竹棑仔港」(竹筏港)，接通國賽港、鹿耳門港與大員港，俾便輸運貨品進出府城，以下何者與其無關？", "options": ["留下四草湖遺跡", "於鹿耳門溪北設「檢驗站」", "於鹿耳門溪南設「釐金局」", "開鑿工程的「清港官」 叫黃任。"], "id": 152}, {"orig_id": 153, "category": "台南文史", "ans": "C", "q": "戰後在臺南最早投入臺語現代詩創作的詩人是", "options": ["王育德", "水蔭萍", "林宗源", "李魁賢。"], "id": 153}, {"orig_id": 154, "category": "台南文史", "ans": "A", "q": "有關目前由農業部所推動的「山海圳國家綠道」，號稱從開臺內海走到臺灣護國聖山，請問下列相關敘述何者為非？", "options": ["西側終點為國聖港燈塔", "東側終點為玉山國山公園", "穿越3 個國家風景區", "穿越四大河川。"], "id": 154}, {"orig_id": 155, "category": "台南文史", "ans": "C", "q": "1823 年曾文溪改道，臺江內海變桑田，入墾者漸次形成的「臺江十六寮」，今屬臺南市安南區轄內，在日治時期則屬於哪一行政區？", "options": ["西港庄", "安定庄", "安順庄", "七股庄。"], "id": 155}, {"orig_id": 156, "category": "台南文史", "ans": "C", "q": "下列哪兩座戲院，名列目前臺南市政府所公告的歷史建築？", "options": ["新營戲院、麻豆戲院", "大觀戲院、全美戲院", "永成戲院、原電姬館", "大舞臺戲院、全成戲院。"], "id": 156}, {"orig_id": 157, "category": "台南文史", "ans": "D", "q": "直轄市定古蹟「原臺南州會」，在2022 年完成修復後，請問館內現有空間使用「不」包含下列何者？", "options": ["臺南中西區圖書館", "臺南市二二八紀念館", "臺南市舊議會家具常設展", "臺南市議政史料館。"], "id": 157}, {"orig_id": 158, "category": "台南文史", "ans": "A", "q": "目前臺語文學刊物發行最密集的都市是", "options": ["臺南市", "臺北市", "臺中市", "高雄市。"], "id": 158}, {"orig_id": 159, "category": "台南文史", "ans": "D", "q": "南瀛天文教育園區的設立，為地方政府發展天文教育之濫觴。請問下列有關南瀛天文教育園區的敘述，何者為非？", "options": ["擁有球幕3D 星象劇場", "位處偏鄉，光害程度較都市為低", "擁有平地最大口徑的天文望遠鏡", "為全臺灣第一個以天文教育推廣為主的社教機構。"], "id": 159}, {"orig_id": 160, "category": "台南文史", "ans": "A", "q": "全國第一個專業臺語文認證常態性機構「臺灣語文測驗中心」設立於", "options": ["成功大學", "臺灣大學", "真理大學", "臺南大學。"], "id": 160}, {"orig_id": 161, "category": "台南文史", "ans": "C", "q": "十八世紀初葉黃叔璥《臺海使槎錄》〈番俗六考〉採錄的三十四首平埔族歌謠中，下列何者「不在」臺南境內？", "options": ["新港社〈別婦歌〉", "蕭壠社〈種稻歌〉", "下淡水社〈頌祖歌〉", "哆囉嘓社〈麻達遞送公文歌〉。"], "id": 161}, {"orig_id": 162, "category": "台南文史", "ans": "D", "q": "下列何者是葉石濤的作品？", "options": ["《鸚鵡與竪琴》", "《臺灣文學史綱》", "《葫蘆巷春夢》", "以上皆是。"], "id": 162}, {"orig_id": 163, "category": "台南文史", "ans": "D", "q": "府城悠久的民俗傳統「做十六歲」成年禮，傳說與渡頭童工「轉大人領全薪」的掌故有關，與下列哪間寺廟有地緣關係？", "options": ["下南河南沙宮", "四協境開隆宮", "小媽祖樓天后宮", "南勢街西羅殿。"], "id": 163}, {"orig_id": 164, "category": "台南文史", "ans": "D", "q": "1627 年荷蘭牧師所書寫的「論述(Discours )」，簡單記述了臺灣西南平原荷蘭商館周邊，原住民的經濟生活社會組織、節慶禁忌、兩性關係、物質文化與精神世界的狀況等，為歐洲人認識臺灣原住民的基礎文本。試問該文的作者？", "options": ["亨布魯克(Antonius Hambroek)", "尤紐斯 (Robertus Junius )", "倪但理 (Daniël Gravius )", "甘迪留斯( Georgius Candidius)。"], "id": 164}, {"orig_id": 165, "category": "台南文史", "ans": "A", "q": "「臺灣詩路」位於", "options": ["臺南市鹽水區", "臺南市麻豆區", "臺中市南屯區", "臺南市善化區。"], "id": 165}, {"orig_id": 166, "category": "台南文史", "ans": "A", "q": "日治時期臺灣有三大傳統詩社，由臺南地區詩人所倡組的是那個詩社？", "options": ["南社", "瀛社", "櫟社", "礪社。"], "id": 166}, {"orig_id": 167, "category": "台南文史", "ans": "B", "q": "清朝傳統詩中的臺灣八景「斐亭聽濤」與「澄臺觀海」，其中斐亭、澄臺係指何地？", "options": ["赤崁樓", "道署內的亭園(寓望園)", "安平古堡", "二鯤身。"], "id": 167}, {"orig_id": 168, "category": "台南文史", "ans": "C", "q": "鄭溪泮是永康蜈蜞潭人，於1926 年出版臺灣第一本白話文(羅馬字)長篇小說《生死線》，是由那家出版社出版？", "options": ["興文齋", "金萬字", "醒世社", "南一書店。"], "id": 168}, {"orig_id": 169, "category": "台南文史", "ans": "D", "q": "吳新榮的臺語詩〈故鄉的輓歌〉，發表在東京的那個刊物？", "options": ["《讀賣新聞》", "《每日新聞》", "《臺灣青年》", "《里門會誌》。"], "id": 169}, {"orig_id": 170, "category": "台南文史", "ans": "B", "q": "鹽水傳統女詩人黃金川曾經參加下列那個詩社？", "options": ["南瀛詩社", "月津詩社", "北門詩社", "海鷗詩社。"], "id": 170}, {"orig_id": 171, "category": "台南文史", "ans": "D", "q": "目前臺語文學以何種文字來書寫？", "options": ["漢字", "羅馬字", "漢字與羅馬字並用", "以上皆是。"], "id": 171}, {"orig_id": 172, "category": "台南文史", "ans": "C", "q": "清領時期臺江水文環境變動劇烈，鹿耳門古媽祖廟遭遇洪患沖毀，神尊曾移駕城區宮廟代為祭祀並辦理普度祭儀，此即「鹿耳門寄普」的由來。試問哪一間寺廟是當時媽祖駐蹕的宮廟？", "options": ["開基天后宮", "祀典武廟", "海安宮", "水仙宮。"], "id": 172}, {"orig_id": 173, "category": "台南文史", "ans": "A", "q": "每當南瀛天文教育園區舉辦各項天文活動時，總會吸引許多觀星人潮。抬頭仰望星辰，我們可以發現，天上的星星有不同的顏色。有的星星顏色比較紅，有的則是偏藍。不同的顏色代表著不同的表面溫度。請問下列星體何者的溫度最高？", "options": ["天狼星", "太陽", "五車二", "心宿二。"], "id": 173}, {"orig_id": 174, "category": "台南文史", "ans": "D", "q": "戰後第一位女詩人陳秀喜女士曾於七、八○年代居住在臺南的哪個地方？", "options": ["安平", "走馬瀨農場", "烏山頭", "關仔嶺。"], "id": 174}, {"orig_id": 175, "category": "台南文史", "ans": "D", "q": "臺灣島是板塊擠壓所誕生，現今臺灣冒出海平面以來約有幾年？", "options": ["50萬年", "100 萬年", "1,000 萬年", "250 萬年。"], "id": 175}, {"orig_id": 176, "category": "台南文史", "ans": "B", "q": "有關風神廟的描述何者不正確？", "options": ["在南河港西門城(今西羅殿)外", "嘉慶四年創建", "祀有雷公、電母", "前有接官亭。"], "id": 176}, {"orig_id": 177, "category": "台南文史", "ans": "D", "q": "哪一寺廟的照牆是三級古蹟？", "options": ["延平郡王祠", "開隆宮", "普濟殿", "萬福庵。"], "id": 177}, {"orig_id": 178, "category": "台南文史", "ans": "A", "q": "有關「烏特勒支堡」的敘述何者有誤？", "options": ["位於桶盤棧", "又稱湯匙山", "鄭成功軍隊與荷軍在此發生重要戰役", "位於安平第一公墓。"], "id": 178}, {"orig_id": 179, "category": "台南文史", "ans": "D", "q": "下列哪一座牌坊是臺南市唯一的雙柱單間形式小型牌坊？", "options": ["重道崇文坊", "泮宮坊", "接官坊", "蕭氏節孝坊。"], "id": 179}, {"orig_id": 180, "category": "台南文史", "ans": "D", "q": "「學甲香」為大臺南重要香科之一，在2022 年登錄為國定民俗，請問下列有關「學甲香」的敘述，何者有誤？", "options": ["有遙祭泉州白礁祖廟儀式", "有著名的人力肩扛「百足真人」蜈蚣陣", "一般每四年舉行一次", "有送王「燒王船」的習俗。"], "id": 180}, {"orig_id": 181, "category": "台南文史", "ans": "B", "q": "現位於赤崁樓外面之九座御龜碑為平定什麼事件後所立的？", "options": ["朱一貴事變", "林爽文事變", "戴潮春事件", "余清芳事件。"], "id": 181}, {"orig_id": 182, "category": "台南文史", "ans": "A", "q": "全臺最早的牌匾是:", "options": ["鷲嶺北極殿的「威靈赫奕」", "天壇的「一」字匾", "臺灣府城隍廟的「爾來了」", "竹溪寺的「了然世界」。"], "id": 182}, {"orig_id": 183, "category": "台南文史", "ans": "D", "q": "以下關於湯德章之敘述何者正確？", "options": ["通過日本「高等文官司法人員考試」，考取律師，曾任警官、協議會議員", "二二八事件發生，湯德章被選為臺南市治安組長，維持臺南市治安", "於二二八事件中無辜受害", "以上皆是。"], "id": 183}, {"orig_id": 184, "category": "台南文史", "ans": "B", "q": "南部陽光充足，適合推動哪種產業做為替代能源發電建構低碳綠能城市？", "options": ["風力發電", "太陽能發電", "水力發電", "火力發電。"], "id": 184}, {"orig_id": 185, "category": "台南文史", "ans": "A", "q": "臺南的四草有一聞名的綠色隧道，請問這是哪一種生態的保護區？", "options": ["紅樹林", "亞熱帶雨林", "檜木林", "疏林。"], "id": 185}, {"orig_id": 186, "category": "台南文史", "ans": "A", "q": "臺南市平均年降水約介於下列何者？", "options": ["1,600~1,900mm", "500~1,000mm", "1,800~2,500mm", "2,500~3,000mm。"], "id": 186}, {"orig_id": 187, "category": "台南文史", "ans": "D", "q": "府城著名俗語：「食水馬兵營，隱居檨仔林。」請問「檨仔林」指的是現在的哪裡？", "options": ["大天后宮", "祀典武廟", "司法博物館", "臺南美術二館。"], "id": 187}, {"orig_id": 188, "category": "台南文史", "ans": "C", "q": "原臺南地方法院完成於大正3 年(1914)，屬廣義的「歷史式樣建築風格」，曾被譽為日治時期臺灣三大建築之一。請問，其設計師為何人？", "options": ["松本虎太", "矢田貝陸", "森山松之助", "梅澤捨次郎。"], "id": 188}, {"orig_id": 189, "category": "台南文史", "ans": "C", "q": "臺南俗諺：「第一倯(sông)，褪赤跤，戴草笠，坐流籠。」請問，這句話是在形容府城哪個景點的特色？", "options": ["赤崁樓", "大菜市", "林百貨", "美術館。"], "id": 189}, {"orig_id": 190, "category": "台南文史", "ans": "A", "q": "臺南日治時期的公共設施中，下列何者屬於少數僅存的明治年代建築？", "options": ["原測候所", "原林百貨", "原臺南州廳", "原合同廳舍。"], "id": 190}, {"orig_id": 191, "category": "台南文史", "ans": "B", "q": "荷治時期，臺灣最重要的農業作物為何？", "options": ["檳榔、紅藜", "稻米、甘蔗", "番薯、芋頭", "荷蘭豆、小米。"], "id": 191}, {"orig_id": 192, "category": "台南文史", "ans": "C", "q": "乾隆17 年(1752)王必昌之《重修臺灣縣志》卷二山水志溪港潭陂目：「…源出小南門內，經寧南坊府文廟前，西流至塗墼埕入臺江。」請問此溪指的是？", "options": ["竹溪", "枋溪", "福安坑溪", "德慶溪。"], "id": 192}, {"orig_id": 193, "category": "台南文史", "ans": "D", "q": "嘉慶12 年(1807)謝金鑾之《續修臺灣縣志》卷一地志山水目：「…俗呼『坑仔底』，源出小東門外舊萬壽宮前，入郡東安坊，合舊縣署後並府署東二泉，西流經縣署右至水仔尾北廠，入於臺江。」請問此溪指的是？", "options": ["竹溪", "枋溪", "福安坑溪", "德慶溪。"], "id": 193}, {"orig_id": 194, "category": "台南文史", "ans": "B", "q": "自古府城地形，有七座較大山丘，為崙仔頂、山川臺、鷲嶺、赤崁、山仔尾、覆鼎金、尖山，有如一隻展翅飛翔之鳳凰，故名「鳳凰七丘」。其中鳳凰的頭部位於何處？", "options": ["鷲嶺", "赤崁", "尖山", "崙仔頂。"], "id": 194}, {"orig_id": 195, "category": "台南文史", "ans": "B", "q": "府城俗語：「啉著大井水，無肥也會媠(suí)。」請問「大井頭」位於現在哪個路上？", "options": ["民族路", "民權路", "民生路", "西門路。"], "id": 195}, {"orig_id": 196, "category": "台南文史", "ans": "D", "q": "府城著名俗語：「南風若轉北，王城去一角。」請問「王城」指的是現在的哪裡？", "options": ["赤崁樓", "大南門", "億載金城", "安平古堡。"], "id": 196}, {"orig_id": 197, "category": "台南文史", "ans": "A", "q": "2024 年，臺南市舉辦「臺南400」系列活動，其時間軸序開端有最早建造「城(堡壘)」的意涵，請問此「城」指的是？", "options": ["熱蘭遮城", "普羅民遮城", "大西門城", "億載金城。"], "id": 197}, {"orig_id": 198, "category": "台南文史", "ans": "D", "q": "府城著名俗語：「行到六甲頂，腳冷手也冷。」意思是指清朝時期位於小北門外的「六甲頂」這個地方？", "options": ["天氣寒冷", "人跡罕至", "路途崎嶇", "盜匪橫行。"], "id": 198}, {"orig_id": 199, "category": "台南文史", "ans": "B", "q": "府城俗諺：「上帝廟的砛墘(gîm-kînn)，水仙宮的簾簷(nînn-tsînn)。」請問，「砛墘(gîm-kînn)」，「簾簷(nînn-tsînn)」這兩個臺語詞，分別指的是？", "options": ["屋簷、臺階", "臺階、屋簷", "臺階、門檻", "門檻 屋簷。"], "id": 199}, {"orig_id": 200, "category": "台南文史", "ans": "A", "q": "府城作家許丙丁的名著《小封神》，故事之中的主人翁為下列何者？", "options": ["小上帝爺", "關聖帝君", "三太子", "魁星爺。"], "id": 200}, {"orig_id": 201, "category": "台南文史", "ans": "D", "q": "府城作家許丙丁除了名著《小封神》之外，還有下列哪個作品？", "options": ["蝴蝶巷春夢", "拋荒的故事", "永遠的故鄉", "廖添丁再世。"], "id": 201}, {"orig_id": 202, "category": "台南文史", "ans": "B", "q": "清道光17 年，府城名人吳尚新曾遠赴蘇州訂購一口古鐘，捐贈給下列哪一個寺廟？", "options": ["天公廟", "北極殿", "大天后宮", "孔子廟。"], "id": 202}, {"orig_id": 203, "category": "台南文史", "ans": "A", "q": "府城俗諺：「有樓仔內的厝，無樓仔內的富；有樓仔內的富，無樓仔內的厝。」這裡的「樓仔內」指的是？", "options": ["吳園", "固園", "萊園", "晴園。"], "id": 203}, {"orig_id": 204, "category": "台南文史", "ans": "D", "q": "當你來到臺南某寺廟，見殿內刻有「開萬古得未曾有之奇，洪荒留此山川，作遺民世界；極一生無可如何之遇，缺憾還諸天地，是剏格完人。」之對聯時，這裡應該是？", "options": ["孔子廟", "大天后宮", "祀典武廟", "延平郡王祠。"], "id": 204}, {"orig_id": 205, "category": "台南文史", "ans": "C", "q": "乾隆嘉慶年間，是五條港商業的鼎盛時期，當時有三郊的貿易集團，掌控府城的經濟命脈。請問所謂的「三郊」不包含下列何者？", "options": ["南郊蘇萬利", "北郊李勝興", "鹽郊吳尚新", "糖郊金永順。"], "id": 205}, {"orig_id": 206, "category": "台南文史", "ans": "A", "q": "臺南市境內最大的河流~曾文溪主流、上游支流後堀溪形成哪一種類型水系？", "options": ["格子狀", "樹枝狀", "放射狀", "平行狀。"], "id": 206}, {"orig_id": 207, "category": "台南文史", "ans": "B", "q": "丘逢甲於〈臺灣竹枝詞〉中寫道：「水仙宮外水通潮，潮去潮來暮又朝。幾陣好風吹得到，碧桃花下聽吹簫。」請問詞中此「水」指的應是五條港中的哪一條？", "options": ["佛頭港", "南勢港", "新港墘港", "安海港。"], "id": 207}, {"orig_id": 208, "category": "台南文史", "ans": "A", "q": "府城俗語：「三日拍到府，一暝溜到厝。」指的是清朝時期所發生的哪一個民變？", "options": ["朱一貴事件", "林爽文事件", "戴潮春事件", "施九緞事件。"], "id": 208}, {"orig_id": 209, "category": "台南文史", "ans": "A", "q": "荷蘭時期曾利用平埔族群人弭平的漢人反抗的是哪一事件？", "options": ["郭懷一事件", "搭加里揚事件", "濱田濔兵衛事件", "朱一貴事件。"], "id": 209}, {"orig_id": 210, "category": "台南文史", "ans": "C", "q": "1924 年臺南兩位名醫黃金火與韓石泉，於臺南本町四丁目(今民權路二段)合作創辦了哪家醫院，進行醫療及作為文化劇團排演的場所？", "options": ["自由", "和平", "共和", "大安。"], "id": 210}, {"orig_id": 211, "category": "台南文史", "ans": "B", "q": "位於臺南市中西區公園路的太平境馬雅各紀念教會，舊教堂正門前面有一大溝經過，故又名「溝仔底教會」。請問這條大溝是指哪條溪流？", "options": ["竹溪", "枋溪", "德慶溪", "福安坑溪。"], "id": 211}, {"orig_id": 212, "category": "台南文史", "ans": "A", "q": "曾經說過：「語言是民族的靈魂」。他一生極力推展臺語活動，也是世界第一位因為研究臺語而得到東京大學博士學位的人是？", "options": ["王育德", "蔡培火", "吳守禮", "鄭良偉。"], "id": 212}, {"orig_id": 213, "category": "台南文史", "ans": "C", "q": "戰後初期，王育德與葉石濤、黃昆彬等幾位文藝青年，曾在龍瑛宗擔任日文版總主編的哪間報社，多次發表文章？", "options": ["中央日報", "中國時報", "中華日報", "聯合報。"], "id": 213}, {"orig_id": 214, "category": "台南文史", "ans": "B", "q": "戰後初期，王育德為了臺南一中與臺南女中的文藝表演會，特地編寫了一齣臺語劇本《青年之路》，並擔任演出。當時文藝表演會的地點在？", "options": ["全美戲院", "延平戲院", "南都戲院", "赤崁戲院。"], "id": 214}, {"orig_id": 215, "category": "台南文史", "ans": "C", "q": "請問下列有關臺南「法華寺」的敘述，何者有誤？", "options": ["原址為明鄭參軍陳永華之好友李茂春居處", "過往有「夢蝶園」之稱", "清代蔣元樞改建為佛寺", "寺名源自「妙法蓮華經」。"], "id": 215}, {"orig_id": 216, "category": "台南文史", "ans": "A", "q": "〈王育德紀念館〉於2018 成正式成立，館址位於何處？", "options": ["吳園(原臺南公會堂)", "中西區圖書館", "忠義國小武德殿", "原臺南郵便局。"], "id": 216}, {"orig_id": 217, "category": "台南文史", "ans": "B", "q": "日治時期，第一位在日本京都擔任檢察官的臺灣人是？", "options": ["王育德", "王育霖", "湯德章", "林茂生。"], "id": 217}, {"orig_id": 218, "category": "台南文史", "ans": "D", "q": "日治時期，第一位在現今成功大學擔任教授兼圖書館館長的臺灣人是？", "options": ["王育德", "王育霖", "湯德章", "林茂生。"], "id": 218}, {"orig_id": 219, "category": "台南文史", "ans": "B", "q": "1921 年出生於臺南州，州立臺南第二高等女學校畢業後，隨即前往日本，進入「石井漠舞踊體育學校」學習現代舞，為臺灣首位留日的現代舞者，被稱為「臺灣現代舞之母」的是？", "options": ["林湘芸", "蔡瑞月", "李彩娥", "崔承喜。"], "id": 219}, {"orig_id": 220, "category": "台南文史", "ans": "A", "q": "運用交響樂形式提升臺灣民謠地位，並組織具有臺灣特色的合唱團巡迴演唱，開流行音樂風氣之先河。其代表作有《安平追想曲》、《南都之夜》、《鑼聲若響》的音樂家是誰？", "options": ["許石", "文夏", "洪一峰", "吳晉淮。"], "id": 220}, {"orig_id": 221, "category": "台南文史", "ans": "B", "q": "本名王瑞河，生平錄製超過一千首歌曲，其代表作包括《黃昏的故鄉》、《媽媽請妳也保重》、《星星知我心》，有「寶島歌王」之稱的是？", "options": ["許石", "文夏", "洪一峰", "吳晉淮。"], "id": 221}, {"orig_id": 222, "category": "台南文史", "ans": "C", "q": "年輕時曾與文夏合組樂團，後來創辦奇美實業、奇美醫院、奇美博物館，有「臺灣壓克力之父」稱譽的人是？", "options": ["吳修齊", "侯雨利", "許文龍", "陳由豪。"], "id": 222}, {"orig_id": 223, "category": "台南文史", "ans": "B", "q": "出生於臺南柳營世家，是日治時期臺灣最早到法國學習繪畫的四位臺灣畫家之一，曾以作品〈紅衣〉入選1933 年巴黎秋季沙龍的美術家是？", "options": ["顏水龍", "劉啟祥", "陳清汾", "楊三郎。"], " 單", "口緣有劃紋", "以上皆是。"], "id": 236}, {"orig_id": 237, "category": "台南文史", "ans": "C", "q": "臺南地區出土臺灣閃玉製品最早的史前文化為下列何者 ？", "options": ["蔦松文化", "大湖文化", "大坌坑文化", "牛稠子文化。"], "id": 237}, {"orig_id": 238, "category": "台南文史", "ans": "D", "q": "南科臺南園區大坌坑文化的文化特徵是下列何者？", "options": ["穀類作物種植", "陶器器型簡單", "養狗", "以上皆是。"], "id": 238}, {"orig_id": 239, "category": "台南文史", "ans": "A", "q": "下列臺南七條主要河川，其出海口依序由南而北排列，何者正確？", "options": ["二仁溪、鹽水溪、鹿耳門溪、曾文溪、將軍溪、急水溪、八掌溪", "二仁溪、曾文溪、鹿耳門溪、鹽水溪、急水溪、將軍溪、八掌溪", "二仁溪、鹽水溪、鹿耳門溪、急水溪、曾文溪、將軍溪、八掌溪", "二仁溪、急水溪、鹽水溪、鹿耳門溪、曾文溪、將軍溪、八掌溪。"], "id": 239}, {"orig_id": 240, "category": "台南文史", "ans": "A", "q": "請問下列有關國定古蹟「臺南火車站」的敘述，何者有誤？", "options": ["為臺灣鐵路公司縱貫線的特等站", "為日治時期改建的「第二代車站」", "二樓原為餐廳及旅館", "建材以鋼骨鋼筋混凝土為主。"], "id": 240}, {"orig_id": 241, "category": "台南文史", "ans": "D", "q": "下列何者為蔦松文化陶器的特徵？", "options": ["素面陶器", "陶環", "小型黑色祭祀陶器", "以上皆是。"], "id": 241}, {"orig_id": 242, "category": "台南文史", "ans": "C", "q": "臺灣目前發現最早稻米和小米種植的史前文化，是南部科學園區臺南園區的哪一個文化？", "options": ["蔦松文化", "大湖文化", "大坌坑文化", "牛稠子文化。"], "id": 242}, {"orig_id": 243, "category": "台南文史", "ans": "A", "q": "下列何者是以臺南市考古遺址命名的史前文化？", "options": ["蔦松文化", "大湖文化", "大坌坑文化", "以上皆是。"], "id": 243}, {"orig_id": 244, "category": "台南文史", "ans": "C", "q": "臺南地區的新石器時代史前文化曾經出土大量澎湖生產的特殊石材製造的石器，原料屬於下列何者？", "options": ["閃玉", "安山岩", "橄欖石玄武岩", "板岩。"], "id": 244}, {"orig_id": 245, "category": "台南文史", "ans": "A", "q": "荷蘭時期曾利用平埔族群人弭平的漢人反抗的是哪一事件？", "options": ["郭懷一事件", "林爽文事件", "濱田濔兵衛事件", "朱一貴事件。"], "id": 245}, {"orig_id": 246, "category": "台南文史", "ans": "D", "q": "臺南地區的金屬器時代，或稱鐵器時代史前文化裝飾品的外來特殊材料，原料包括下列何者？", "options": ["玻璃", "瑪瑙", "各類金屬", "以上皆是。"], "id": 246}, {"orig_id": 247, "category": "台南文史", "ans": "C", "q": "臺南平原地區史前文化的晚期階段，最可能和哪一個原住民族有關？", "options": ["鄒族", "排灣族", "西拉雅族", "以上皆是。"], "id": 247}, {"orig_id": 248, "category": "台南文史", "ans": "D", "q": "自1635 年開始，荷蘭統治者對哪些原住民展開武力征戰，曾經強力對付那些人群或部落？", "options": ["麻豆社", "小琉球拉美島人", "費佛朗人", "以上皆是。"], "id": 248}, {"orig_id": 249, "category": "台南文史", "ans": "D", "q": "清廷平定哪一民變後，為了加強府城城防，於 胖羅漢", "「臺南孔廟」下馬碑。"], "id": 275}, {"orig_id": 276, "category": "台南文史", "ans": "D", "q": "位於將軍區青鯤鯓庄北的扇形鹽田， 是哪個時期所開闢？", "options": ["鄭氏時期", "清領時期", "日治時期", "戰後。"], "id": 276}, {"orig_id": 277, "category": "台南文史", "ans": "C", "q": "世界文化遺產包括文化紀念物 (monuments)、建築群 (groups of buildings)、歷史場所(sites)等三大類，臺南市被列為「臺灣世界遺產潛力點」的是哪一項？", "options": ["臺江國家公園", "臺灣府城城門及城垣殘蹟", "烏山頭水庫及嘉南大圳", "新市．木柵遺址。"], "id": 277}, {"orig_id": 278, "category": "台南文史", "ans": "C", "q": "乙未戰役 (1895)被稱為「竹篙山之神」的林崑岡，所帶領的抗日義勇軍被稱作？", "options": ["銅牌軍", "鐵牌軍", "棉被牌軍", "藤牌軍。"], "id": 278}, {"orig_id": 279, "category": "台南文史", "ans": "B", "q": "臺南西濱潮汐有「初十二五下晝渡」之諺，「下晝」(ē-tàu)就是下午，此諺潮汐是指農曆十日、廿五日的下午", "options": ["正在漲潮", "正在退潮", "已滿潮", "退潮後即將漲潮。"], "id": 279}, {"orig_id": 280, "category": "台南文史", "ans": "A", "q": "臺南元宵燈會名聞遐邇，以下哪個燈會歷史最久？", "options": ["月津港燈會", "新營波光節", "臺南普濟殿燈會", "龍崎光節空山祭。"], "id": 280}, {"orig_id": 281, "category": "台南文史", "ans": "C", "q": "臺南西濱海域時有鯨豚擱淺之事發生，現今北門遊客中心有「鎮館之寶」之稱的抹香鯨骨骼標本，即是 2005 年12 月所發現者，當時擱淺的沙洲是？", "options": ["青山港汕", "頂頭額汕", "王爺港汕", "外傘頂洲。"], "id": 281}, {"orig_id": 282, "category": "台南文史", "ans": "D", "q": "臺南與鹽業有關的有形文化資產，細說著臺鹽發展史，以下哪個不屬於臺南市？", "options": ["臺鹽隆田儲運站", "井仔腳瓦盤鹽田", "頂山鹽警槍樓", "原烏樹林製鹽株式會社辦公室。"], "id": 282}, {"orig_id": 283, "category": "台南文史", "ans": "B", "q": "臺南濱海地區對魚類流傳著「一魟、二虎、三沙毛、四變身苦」之諺，這是指什麼的排行榜？", "options": ["好吃", "毒性", "大小", "美觀。"], "id": 283}, {"orig_id": 284, "category": "台南文史", "ans": "B", "q": "日治時期就讀嘉義農林學校，參加該校棒球隊，並於1931 年夏季甲子園的比賽，擊出了一支全壘打牆前的三壘安打者蘇正生，出生於臺南州新營郡番社庄，請問番社庄是今日下列哪一臺南市行政區域？", "options": ["白河", "東山", "南化", "左鎮。"], "id": 284}, {"orig_id": 285, "category": "台南文史", "ans": "B", "q": "下面哪一項，不是臺南境內具有的特殊地貌？", "options": ["河階臺地", "高原", "溪流浮洲", "切斷曲流。"], "id": 285}, {"orig_id": 286, "category": "台南文史", "ans": "A", "q": "北門內海係倒風內海的遺跡，下列哪一條河流與其無關？", "options": ["七股溪", "將軍溪", "急水溪", "頭港大排。"], "id": 286}, {"orig_id": 287, "category": "台南文史", "ans": "D", "q": "下列哪一項不是臺南現今養蚵的主要方法？", "options": ["平掛式蚵架", "垂吊式蚵架", "浮筏式蚵棚", "插篊式。"], "id": 287}, {"orig_id": 288, "category": "台南文史", "ans": "C", "q": "日治時期下營流傳富翁排行榜「第一上帝公，第二曾春風，第三敧頭(khi-thâu，歪頭)旺，第四文貴王」之俗諺，「上帝公」指的是北極殿主神玄天上帝，其致富原因為何？", "options": ["信眾集資捐錢", "長期收停車費", "擁有龐大農地", "開設醫院。"], "id": 288}, {"orig_id": 289, "category": "台南文史", "ans": "D", "q": "「余清風，害死王爺公；王爺公仔無保庇，害死蘇有志」，這是日治時期哪一個歷史事件所留下來的俗諺？", "options": ["乙未戰役", "六甲事件", "關帝廟李阿齊事件", "噍吧哖事件 (西來庵事件 )。"], "id": 289}, {"orig_id": 290, "category": "台南文史", "ans": "B", "q": "「臺南幫」商業集團影響戰後的臺灣經濟，核心成員侯調、侯雨利、吳三連、吳修齊、高清愿等人，出身地何者有誤？", "options": ["北門區二重港", "北門區蚵寮", "學甲區新頭港", "學甲區倒風寮。"], "id": 290}, {"orig_id": 291, "category": "台南文史", "ans": "C", "q": "「市道 174 號」起於北門區蘆竹溝，終於東山區橫路，全長約46.3 公里，沿途經過幾個區？", "options": ["4 區", "5 區", "6 區", "7 區。"], "id": 291}, {"orig_id": 292, "category": "台南文史", "ans": "A", "q": "楠西舊稱「茄拔」，此為西拉雅語「Kabas」，原意是哪指種植物？", "options": ["斑芝花(木棉花)", "林菝(番石榴)", "柑仔蜜(番茄)", "王梨(鳳梨)。"], "id": 292}, {"orig_id": 293, "category": "台南文史", "ans": "C", "q": "「刈香」(kuah-hiunn)廟會是臺南極具特色的宗教文化，西港仔香、 蕭壠香、學甲香、麻豆香、土城仔香等合稱為「 臺南五大香」，藝閣與文武陣頭為其共同核心元素，五大香皆有的藝陣是？", "options": ["宋江陣、白鶴陣", "八家將、官將首", "蜈蚣陣", "水族陣、鬥牛陣。"], "id": 293}, {"orig_id": 294, "category": "台南文史", "ans": "B", "q": "以下何種產業與下營區無關？", "options": ["黑豆", "紅瓦", "白鵝", "蠶絲被。"], "id": 294}, {"orig_id": 295, "category": "台南文史", "ans": "A", "q": "六甲區王爺里有「水流東」小庄，這個地名由來與何者無關？", "options": ["山溝縱橫，水流湍急", "烏山頭水庫", "中央山脈烏山頭分脈", "丘陵地形東低西高。"], "id": 295}, {"orig_id": 296, "category": "台南文史", "ans": "A", "q": "臺南東方丘陵地帶是觀音佛祖信仰重要區塊，下列哪個民俗活動與其無關？", "options": ["羅漢門迎佛祖", "東山碧軒寺迎佛祖暨遶境", "六甲赤山龍湖巖觀音佛祖出巡", "六甲大丘三角頭請佛踅庄。"], "id": 296}, {"orig_id": 297, "category": "台南文史", "ans": "B", "q": "「井仔腳鹽田」闢建於1818 年，係我國現存最古老的瓦盤鹽田，以下何者描述有誤？", "options": ["瀨東鹽場第三代", "洲北鹽場分設", "鯤鯓王平安鹽祭請鹽與謝鹽場域", "由佳里外渡頭遷徙而來。"], "id": 297}, {"orig_id": 298, "category": "台南文史", "ans": "C", "q": "「西拉雅國家風景區」成立於2005 年，原稱「五庫國家風景區」，「五庫」指的是？", "options": ["白河水庫、烏山頭水庫、虎頭埤水庫、曾文水庫和南化水庫", "白河水庫、尖山埤水庫、烏山頭水庫、曾文水庫和南化水庫", "白河水庫、尖山埤水庫、烏山頭水庫、虎頭埤水庫和曾文水庫", "烏山頭水庫、虎頭埤水庫、曾文水庫、鏡面水庫和南化水庫。"], "id": 298}, {"orig_id": 299, "category": "台南文史", "ans": "A", "q": "在臺南地區偶而在地名上會出現「洋」字，如北頭洋、鹿陶洋、香洋、洋仔港…等，請問此一「洋」字的意義為何？", "options": ["平原", "河川", "湖泊", "內海。"], "id": 299}, {"orig_id": 300, "category": "台南文史", "ans": "C", "q": "日治時期的1930 年，是臺灣政經文教變遷的重要一年，下列何者與其無關？", "options": ["嘉南大圳竣工", "臺南舉辦「臺灣文化三百年紀念會」", "「始政四十周年記念臺灣博覽會」臺南特設會場", "南投發生霧社事件。"], "id": 300}], "kaohsiung": [{"orig_id": 1, "category": "地理篇", "ans": "A", "q": "高雄市地層中，含有第三紀碎屑狀沈積岩之砂岩分布在何處？", "options": ["那瑪夏、甲仙、六龜", "大社、大樹、鳳山", "田寮、燕巢", "橋頭、燕巢。"], "id": 1}, {"orig_id": 2, "category": "地理篇", "ans": "C", "q": "惡地地形的特徵為地層岩層裸露、溝谷密佈和植物稀少，此地形主要分布於高雄市何處？", "options": ["那瑪夏、甲仙、六龜", "大社、大樹、鳳山", "田寮、燕巢", "橋頭、燕巢。"], "id": 2}, {"orig_id": 3, "category": "地理篇", "ans": "B", "q": "高雄平原上的河川多發源於丘陵地，除鳳山丘陵外，尚有哪幾處丘陵為河川發源地？", "options": ["那瑪夏、甲仙、六龜", "大社、大樹、鳳山", "田寮、燕巢", "橋頭、燕巢。"], "id": 3}, {"orig_id": 4, "category": "地理篇", "ans": "A", "q": "高雄市境內的主要河川均源於山地，河短流急，在雨季時常出現滾滾洪流的壯觀景象。高雄市與臺南市以哪一條河川做為分界？", "options": ["二仁溪", "典寶溪", "愛河", "高屏溪。"], "id": 4}, {"orig_id": 5, "category": "地理篇", "ans": "D", "q": "高雄市境內的主要河川均源於山地，河短流急，在雨季時常出現滾滾洪流的壯觀景象。高雄市與屏東縣以哪一條河川做為分界？", "options": ["二仁溪", "典寶溪", "愛河", "高屏溪。"], "id": 5}, {"orig_id": 6, "category": "地理篇", "ans": "D", "q": "高雄市半屏山因為「珊瑚礁石灰岩」地質曾為水泥原料產地，下列各區的地質結構何者與此區不同？", "options": ["大、小崗山", "壽山", "半屏山", "漯底山。"], "id": 6}, {"orig_id": 7, "category": "地理篇", "ans": "D", "q": "溺谷地形為海平面相對上升，海水淹沒原來的沿海陸地與河流下游谷地所形成的地形。臺灣西部海岸線中，唯一的溺谷海岸位於高雄市哪一條河川出口處？", "options": ["二仁溪", "典寶溪", "愛河", "高屏溪。"], "id": 7}, {"orig_id": 8, "category": "地理篇", "ans": "A", "q": "旋轉斷層 (Pivotal Fault) 是一種特殊的斷層運動，其特點是斷層兩側岩塊不是直線移動，而是繞著一個垂直於斷層面的樞紐軸發生旋轉。某斷層由寶來至恆春呈南北走向，斷層線所經谷口的新舊四期沖積扇交互生成。某斷層為何者？", "options": ["潮州斷層", "壽山斷層", "六龜斷層", "旗山斷層。"], "id": 8}, {"orig_id": 9, "category": "地理篇", "ans": "D", "q": "以下有關於「高屏溪」的敘述，何者有誤？", "options": ["由荖濃溪、楠梓仙溪等匯合後形成", "主要支流有荖濃溪與旗山溪等", "下游出海口在林園區", "全流域砂石場林立，因任意盜採砂石常危及橋樑安全。"], "id": 9}, {"orig_id": 10, "category": "地理篇", "ans": "D", "q": "以下有關於「曹公圳」的敘述，何者有誤？", "options": ["興建於清道光年間，分有南北兩支圳", "由鳳山知縣曹謹和地方父老仕紳共同籌建", "自九曲堂引高屏溪的水進入高雄平原", "南支舊圳灌溉苓雅、前鎮、新興、三民、左營與鼓山一帶。"], "id": 10}, {"orig_id": 11, "category": "地理篇", "ans": "A", "q": "區內景觀資源有半屏山，還有高雄都會公園、援中港等提供民眾郊遊踏青的行政區為？", "options": ["楠梓區", "左營區", "鼓山區", "梓官區。"], "id": 11}, {"orig_id": 12, "category": "地理篇", "ans": "B", "q": "位置西臨台灣海峽，擁有有海軍基地，且清代為鳳山縣縣治所在地的行政區為？", "options": ["鳳山區", "左營區", "鼓山區", "楠梓區。"], "id": 12}, {"orig_id": 13, "category": "地理篇", "ans": "B", "q": "區內有漢神巨蛋購物中心、瑞豐夜市形成的「巨蛋商圈」的行政區為？", "options": ["楠梓區", "左營區", "鼓山區", "前鎮區。"], "id": 13}, {"orig_id": 14, "category": "地理篇", "ans": "C", "q": "此區域因留下日治時期的古建築物加上自然美景，時常辦理文化活動增進民眾對於昔日高雄港的發展歷程及臨港線鐵路的認識，此行政區為？", "options": ["楠梓區", "左營區", "鼓山區", "前鎮區。"], "id": 14}, {"orig_id": 15, "category": "地理篇", "ans": "A", "q": "我國最南方的領地—南海上的東沙島及南沙太平島為高雄市某區管轄，此行政區為？", "options": ["旗津區", "小港區", "林園區", "前鎮區。"], "id": 15}, {"orig_id": 16, "category": "地理篇", "ans": "D", "q": "由建國路、博愛路、十全路、九如路等區塊所形成的「火車站商圈」位於哪一個行政區？", "options": ["新興區", "前金區", "苓雅區", "三民區。"], "id": 16}, {"orig_id": 17, "category": "地理篇", "ans": "D", "q": "本區以地方屬性區分為五個部落，區內居民仍保有以早期部落名稱（如：草衙、崗山仔、籬仔內等）區分地名的習慣，此區為？", "options": ["岡山區", "小港區", "林園區", "前鎮區。"], "id": 17}, {"orig_id": 18, "category": "地理篇", "ans": "B", "q": "此區擁有高雄國際航空站、高雄港以及民國六十年代政府推動之十大建設，並使當地型態由於農轉為工業，此行政區為？", "options": ["岡山區", "小港區", "林園區", "前鎮區。"], "id": 18}, {"orig_id": 19, "category": "地理篇", "ans": "C", "q": "區域內的「玫瑰聖母堂」在造型上屬於簡化哥德風格並混合仿羅馬風格，為臺灣天主教的發源地，位於哪一個行政區？", "options": ["新興區", "前金區", "苓雅區", "三民區。"], "id": 19}, {"orig_id": 20, "category": "地理篇", "ans": "A", "q": "擁有碼頭閒置倉庫空間再利用的駁二藝術特區，以及帝冠式建築之高雄市立歷史博物館是哪一個行政區？", "options": ["鹽埕區", "三民區", "苓雅區", "小港區。"], "id": 20}, {"orig_id": 21, "category": "地理篇", "ans": "D", "q": "翠屏岩位於觀音山下，此地因山勢和緩、土質細膩，因此登山訪客多半赤腳行走，別稱「赤腳公園」。「赤腳公園」位於哪一個行政區？", "options": ["旗山區", "仁武區", "大樹區", "大社區。"], "id": 21}, {"orig_id": 22, "category": "地理篇", "ans": "B", "q": "以羊肉、蜂蜜與豆瓣醬等三寶著名，並舉辦紀念保家衛鄉義行的「籮仔筐會」重要節慶的行政區為？", "options": ["鳳山區", "岡山區", "旗山區", "燕巢區。"], "id": 22}, {"orig_id": 23, "category": "地理篇", "ans": "A", "q": "擁有雞冠山、太陽谷、烏山頂泥火山、養女湖等景點，形成獨特的自然景觀的行政區為？", "options": ["燕巢區", "楠梓區", "橋頭區", "岡山區。"], "id": 23}, {"orig_id": 24, "category": "地理篇", "ans": "A", "q": "地理位置居中，吸引高師大、樹德科大、高雄科技大學等在此設立分校，形成一個大學城的行政區為？", "options": ["燕巢區", "楠梓區", "橋頭區", "岡山區。"], "id": 24}, {"orig_id": 25, "category": "地理篇", "ans": "B", "q": "本區擁有「月世界」景觀的惡地地形，泥火山遍布，還有屬中性碳酸泉的大崗山溫泉作為觀光資源，此行政區為？", "options": ["岡山區", "田寮區", "內門區", "阿蓮區。"], "id": 25}, {"orig_id": 26, "category": "地理篇", "ans": "D", "q": "日治時代即設置臺灣第一座現代化糖廠的行政區為？", "options": ["旗山區", "小港區", "楠梓區", "橋頭區。"], "id": 26}, {"orig_id": 27, "category": "地理篇", "ans": "C", "q": "位於高雄市的漯底山遺址，發掘出記錄平埔族生活方式，屬於「蔦松文化層」，此遺址位於哪一個行政區？", "options": ["鳥松區", "鼓山區", "彌陀區", "岡山區。"], "id": 27}, {"orig_id": 28, "category": "地理篇", "ans": "A", "q": "此區有名聞全臺的鰻魚養殖區，更因充分利用魚塭的生產力，養魚也養鴨，成為行政院指定的「示範魚牧混養區」，此區是哪一個行政區？", "options": ["湖內區", "彌陀區", "梓官區", "永安區。"], "id": 28}, {"orig_id": 29, "category": "地理篇", "ans": "C", "q": "平成砲臺、鳳儀書院、龍山寺等古蹟林立，並擁有陸軍官校、中正預校、步兵學校而被稱為國軍育才搖籃的行政區為？", "options": ["左營區", "岡山區", "鳳山區", "鼓山區。"], "id": 29}, {"orig_id": 30, "category": "地理篇", "ans": "D", "q": "昔日以製磚工廠眾多而得名之「磚仔窯」(俗稱)，位於哪一個行政區？", "options": ["內門區", "美濃區", "大樹區", "大寮區。"], "id": 30}, {"orig_id": 31, "category": "地理篇", "ans": "C", "q": "位於高雄市南端的清水巖風景區，從日治時期即名列為高雄州八景之一，園區內可見造型豐富的珊瑚礁石灰岩。清水岩風景區位於高雄市何區？", "options": ["小港區", "大樹區", "林園區", "大寮區。"], "id": 31}, {"orig_id": 32, "category": "地理篇", "ans": "B", "q": "擁有清代臺灣最大的水利工程「曹公圳」由此區引入高屏溪水源，至今仍供應高雄地區灌溉與飲用水，並因特有的土質與水質培育的農產造就鳳梨王國、荔枝王國的美譽。此行政區為？", "options": ["小港區", "大樹區", "林園區", "大寮區。"], "id": 32}, {"orig_id": 33, "category": "地理篇", "ans": "A", "q": "此區為重要香蕉產地號稱「香蕉王國」，區內可見由日本人規劃的巴洛克建築；也有維多利亞式及哥德復古式的建築糖廠舊火車站。此區為哪一個行政區？", "options": ["旗山區", "燕巢區", "大樹區", "橋頭區。"], "id": 33}, {"orig_id": 34, "category": "地理篇", "ans": "B", "q": "興建於1908 年，至今仍運轉使用的「竹仔門電廠」，位於哪一個行政區？", "options": ["路竹區", "美濃區", "旗山區", "岡山區。"], "id": 34}, {"orig_id": 35, "category": "地理篇", "ans": "B", "q": "「地處屏東平原與中央山脈之丘陵交會地，居於荖濃溪縱谷西岸河階上，南北狹長。區內的十八羅漢山，山形峻峭有「小桂林」之譽。」文中敘述為哪一個行政區？", "options": ["美濃區", "六龜區", "內門區", "甲仙區。"], "id": 35}, {"orig_id": 36, "category": "地理篇", "ans": "D", "q": "區內為縱谷地形，因斷層落差及複雜褶皺，使得河床上處處可見化石，擁有國內相當優秀的「化石博物館」，並以芋頭、竹筍等農產聞名的行政區為？", "options": ["美濃區", "六龜區", "內門區", "甲仙區。"], "id": 36}, {"orig_id": 37, "category": "地理篇", "ans": "D", "q": "多納溫泉、石板屋、岩雕、木雕、吊橋等天然與人文景色，是哪一個行政區的觀光旅遊資源？", "options": ["杉林區", "六龜區", "桃源區", "茂林區。"], "id": 37}, {"orig_id": 38, "category": "地理篇", "ans": "A", "q": "興達港號稱「臺灣正港的烏魚大港」，而此區被稱為「烏魚子的故鄉」，此為哪一個行政區？", "options": ["茄萣區", "彌陀區", "梓官區", "永安區。"], "id": 38}, {"orig_id": 39, "category": "地理篇", "ans": "D", "q": "位於亞洲新灣區的高雄展覽館（原高雄世貿會展中心）近年來舉辦許多特色活動。此展覽館位於哪一個碼頭南側？", "options": ["漁人碼頭", "真愛碼頭", "光榮碼頭", "新光碼頭。"], "id": 39}, {"orig_id": 40, "category": "地理篇", "ans": "B", "q": "高雄於縣市合併後幅員遼闊，下列哪一縣市沒有與高雄市接壤？", "options": ["南投縣", "雲林縣", "嘉義縣", "花蓮縣。"], "id": 40}, {"orig_id": 41, "category": "地理篇", "ans": "B", "q": "高雄市地處臺灣本島西南部，轄內納管南海上的兩座島嶼，請問這兩座島嶼是？", "options": ["東沙島和西嶼島", "東沙島和太平島", "東沙島和中業島", "太平島和中業島。"], "id": 41}, {"orig_id": 42, "category": "地理篇", "ans": "A", "q": "高雄市的地層分布大致與臺灣全島的構造一致，地勢是呈現何種分布？", "options": ["東北向西南傾斜降低", "東南向西北傾斜降低", "西北向東南傾斜降低", "西南向東北傾斜降低。"], "id": 42}, {"orig_id": 43, "category": "地理篇", "ans": "D", "q": "關於高雄地形特徵的描述，下列何者正確？", "options": ["境內都是廣闊的平原", "境內都是高低起伏的丘陵", "境內東部是平原，西部是丘陵地形", "境內平原、丘陵和山地並存。"], "id": 43}, {"orig_id": 44, "category": "地理篇", "ans": "B", "q": "存疑性活動斷層是指有可能為活動斷層的斷層，包括對斷層的存在性、活動時代、及再活動性具有存疑者。下列何者不是高雄附近地區的存疑性活動斷層？", "options": ["旗山斷層", "梅山斷層", "小崗山斷層", "潮州斷層。"], "id": 44}, {"orig_id": 45, "category": "地理篇", "ans": "A", "q": "關於高雄市氣候特徵，下列敘述何者較為適合？", "options": ["氣溫終年偏高，霜雪幾乎不曾發生", "每月的日照率變化很大", "雨季主要集中在十月至翌年四月", "很少受到颱風的侵襲。"], "id": 45}, {"orig_id": 46, "category": "地理篇", "ans": "B", "q": "高雄市「愛河」是廣為國人知悉的河川，關於愛河的敘述，下列何者正確？", "options": ["愛河在日本時代稱為中都川，當時因修築高雄港而疏濬成航道", "愛河源於本市仁武區的八卦寮埤塘，經市區後流入高雄港", "愛河上游的河道比下游寬廣，經過美化設計後，風光宜人", "愛河曾因工業與家庭廢水造成嚴重汙染，至今汙染情形依舊嚴重。"], "id": 46}, {"orig_id": 47, "category": "地理篇", "ans": "B", "q": "位於高雄市境內，唯一以防洪為主要標的，且為戰後臺灣最早完成之水庫的是哪一座？", "options": ["鳳山水庫", "阿公店水庫", "澄清湖水庫", "南化水庫。"], "id": 47}, {"orig_id": 48, "category": "地理篇", "ans": "A",
